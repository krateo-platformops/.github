name: go-download
description: >-
  Run a Go download command (default `go mod download`), retrying only when it fails with a
  transient network error such as proxy.golang.org dropping a stream. Any other failure fails
  on the first attempt. See retry.sh for the matched errors and the incidents behind this.
inputs:
  run:
    description: "The command to run, e.g. `go mod download` or `go install pkg@version`."
    required: false
    default: go mod download
  working-directory:
    description: "Directory to run it in (composite steps do not inherit a job's defaults.run)."
    required: false
    default: "."
  attempts:
    description: "Total attempts for transient failures."
    required: false
    default: "3"
runs:
  using: composite
  steps:
    - name: ${{ inputs.run }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GO_DOWNLOAD_RUN: ${{ inputs.run }}
        GO_DOWNLOAD_ATTEMPTS: ${{ inputs.attempts }}
      run: bash "${{ github.action_path }}/retry.sh"
