name: release-download
description: >-
  Download one GitHub release asset with the job's token, retrying only transient network errors,
  and verify it against the release's sha256 checksums file. A missing asset or a checksum mismatch
  fails on the first attempt. See download.sh for the matched errors and the incident behind this.
inputs:
  repo:
    description: "The release's repository, owner/name (e.g. gitleaks/gitleaks)."
    required: true
  tag:
    description: "The release tag (e.g. v8.30.1)."
    required: true
  asset:
    description: "The asset's file name (e.g. gitleaks_8.30.1_linux_x64.tar.gz)."
    required: true
  checksums:
    description: "The checksums file's asset name (e.g. gitleaks_8.30.1_checksums.txt)."
    required: true
  dir:
    description: "Directory to download into."
    required: false
    default: ${{ runner.temp }}/release-download
  attempts:
    description: "Total attempts for transient failures."
    required: false
    default: "3"
  token:
    description: "Token gh authenticates with; reading a public release needs no extra permission."
    required: false
    default: ${{ github.token }}
outputs:
  path:
    description: "Path of the verified asset."
    value: ${{ steps.download.outputs.path }}
runs:
  using: composite
  steps:
    - name: Download ${{ inputs.asset }}
      id: download
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        RD_REPO: ${{ inputs.repo }}
        RD_TAG: ${{ inputs.tag }}
        RD_ASSET: ${{ inputs.asset }}
        RD_CHECKSUMS: ${{ inputs.checksums }}
        RD_DIR: ${{ inputs.dir }}
        RD_ATTEMPTS: ${{ inputs.attempts }}
      run: |
        bash "${{ github.action_path }}/download.sh"
        echo "path=$RD_DIR/$RD_ASSET" >> "$GITHUB_OUTPUT"
