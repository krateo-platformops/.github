# Reusable security workflow for Krateo repos.
# HOST THIS AT:  krateo-platformops/.github/.github/workflows/security.yml   (org-level reusable)
#   (or a dedicated krateo-platformops/krateo-ci repo — NOT `plumbing`, which is a Go module
#    imported by only some repos and so can't reach the chart/TS repos.)
#
# Each repo pulls it in with a ~10-line caller (see ../caller.security.yml).
# Auto-detects Go / Node / Helm-chart / Dockerfile — callers usually need NO inputs.
name: security

on:
  workflow_call:
    inputs:
      go-version:
        type: string
        default: "1.23"
      node-version:
        type: string
        default: "20"
      image-ref:
        description: "Optional built image to scan/sign (e.g. ghcr.io/krateo-platformops/foo:tag). Empty = skip image scan."
        type: string
        default: ""

permissions:
  contents: read
  security-events: write   # upload SARIF to GitHub code scanning
  actions: read            # gitleaks-action reads workflow-run metadata
  pull-requests: read      # gitleaks-action lists PR commits on pull_request events

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.d.outputs.go }}
      gomods: ${{ steps.d.outputs.gomods }}
      node: ${{ steps.d.outputs.node }}
      chart: ${{ steps.d.outputs.chart }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        shell: bash
        run: |
          mods=$(find . -maxdepth 3 -name go.mod -not -path "*/vendor/*" -not -path "*/.git/*" | xargs -r -n1 dirname | sed "s#^\./##" | sort -u | jq -R . | jq -sc .)
          [ -z "$mods" ] && mods="[]"
          [ "$mods" = "[]" ] && echo "go=false" >> "$GITHUB_OUTPUT" || echo "go=true" >> "$GITHUB_OUTPUT"
          echo "gomods=$mods" >> "$GITHUB_OUTPUT"
          echo "node=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [ -n "$(git ls-files 'Chart.yaml' '**/Chart.yaml')" ]; then
            echo "chart=true" >> "$GITHUB_OUTPUT"; else echo "chart=false" >> "$GITHUB_OUTPUT"; fi

  # --- Repo-wide: dependency + IaC + secret scanning (all repos) ---
  filesystem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Repo's scoped Trivy exceptions (.trivyignore.yaml), if any
        # A repo may scope an exception to specific files only with Trivy's YAML ignore format
        # (`misconfigurations: [{id, paths, statement}]`); the plain `.trivyignore` Trivy reads by default
        # can only silence a finding repo-wide. trivy-action reads YAML only when passed `trivyignores`
        # and fails if the file is missing, so it is passed only when the repo has one. Repos without
        # the file are unchanged. Not passed to the image scan below: that scans a built image's
        # packages, never the repo's files these exceptions name.
        id: trivyignore
        run: if [ -f .trivyignore.yaml ]; then echo "file=.trivyignore.yaml" >> "$GITHUB_OUTPUT"; fi
      - name: Trivy (vuln + misconfig + secrets)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          trivyignores: ${{ steps.trivyignore.outputs.file }}
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"        # REPORT-ONLY: uploads every CRITICAL+HIGH finding to code-scanning for
                                # visibility, never fails. Enforcement is the gate step below.
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true   # code-scanning upload unavailable on private repos without GHAS
        with: { sarif_file: trivy-fs.sarif, category: trivy-fs }
      - name: Trivy gate (CRITICAL — enforced)
        # ENFORCEMENT: fails the (required) `security / filesystem` check on any CRITICAL vuln/secret/
        # misconfig, so a critical cannot merge (org admins bypass). Scoped to CRITICAL first — HIGH
        # stays report-only above until the fleet is baselined, then bump `severity` here to
        # CRITICAL,HIGH. `ignore-unfixed` drops CRITICAL vulns that have no available fix.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          trivyignores: ${{ steps.trivyignore.outputs.file }}
          scanners: vuln,secret        # gate on CRITICAL CVEs + secrets only; misconfig (KSV) stays
                                        # report-only in the step above (mostly example/dev manifests —
                                        # add misconfig here once those are cleaned/allowlisted)
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      # gitleaks-action@v2 charges ORG-owned repos; the gitleaks TOOL is MIT/free. Install the binary
      # and scan in GIT mode (commit history). NOTE: --no-git wrongly scans .git/ pack files as plain
      # data (slow + false positives); git mode on the runner-owned checkout is correct + fast.
      - name: Gitleaks version (latest release, else v8.30.1)
        id: gitleaks-ver
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          ver="$(gh release view --repo gitleaks/gitleaks --json tagName -q .tagName 2>/dev/null || true)"
          case "$ver" in v[0-9]*.[0-9]*.[0-9]*) ;; *) ver=v8.30.1 ;; esac
          echo "tag=$ver" >> "$GITHUB_OUTPUT"
          echo "version=${ver#v}" >> "$GITHUB_OUTPUT"
      # Downloaded with the job's token and retried on transient errors only, then checked against
      # the release's sha256 file: anonymous downloads 504ed under GitHub's 2026-11-09 incident and
      # failed this job in authn and installer until re-run by hand.
      - name: Download gitleaks
        id: gitleaks-dl
        uses: krateo-platformops/.github/.github/actions/release-download@88eaff13555233606da5ff3ff3bfed8f534436ce # main 2026-11-18
        with:
          repo: gitleaks/gitleaks
          tag: ${{ steps.gitleaks-ver.outputs.tag }}
          asset: gitleaks_${{ steps.gitleaks-ver.outputs.version }}_linux_x64.tar.gz
          checksums: gitleaks_${{ steps.gitleaks-ver.outputs.version }}_checksums.txt
      - name: Gitleaks (secret scan)
        run: |
          tar -xzf "${{ steps.gitleaks-dl.outputs.path }}" gitleaks
          # Shared allowlist: documentation, generated API specs, vendored subcharts, sample
          # manifests, Helm template partials and JSON schemas are not secret stores; they trip
          # the generic-api-key / entropy heuristics on example identifiers and template syntax.
          # Real secrets in source (values.yaml, code, config) are still caught. Repo-specific
          # accepted findings live in a repo-level .gitleaksignore (also honoured below) -- which is
          # for GENUINELY ONE-OFF cases only, above all a finding that exists only in history because it
          # was fixed forward: git mode reports a secret once, at the commit that introduced it, and a
          # commit never changes, so that fingerprint is stable. A finding that recurs in the working
          # tree (a published upstream constant, a vendored default) must be allowlisted by path or
          # pattern ABOVE instead: its fingerprint is commit:file:rule:line and changes whenever the
          # line moves, where a pattern survives that (#32). A path allowlist for a one-off would blind
          # the scan to every future secret in that file.
          cat > /tmp/krateo-gitleaks.toml <<'TOML'
          title = "krateo-gitleaks"
          [extend]
          useDefault = true
          [[allowlists]]
          description = "Non-secret file classes"
          paths = [
            '''(^|/)docs/''',
            '''(^|/)examples/''',
            '''(^|/)quickstart/''',
            '''(^|/)samples?/''',
            '''(^|/)generated/''',
            '''(^|/)oas/''',
            '''(^|/)charts/''',
            '''helm-toolkit/''',
            '''\.md$''',
            '''\.tpl$''',
            '''values\.schema\.json$''',
            # helm-unittest suites: faked-cluster fixtures (kubernetesProvider) must declare Secret
            # objects to exercise lookups, so they trip kubernetes-secret-yaml on fake values.
            '''(^|/)tests/[^/]+_test\.ya?ml$''',
          ]
          [[allowlists]]
          description = "Well-known non-secret placeholder/example values"
          regexTarget = "match"
          regexes = [
            '''REPLACE_WITH_[A-Z0-9_]+''',
            '''(?i)changeme|example|placeholder|dummy|redacted|your[-_]?(key|token|secret|password)''',
            '''dGhpcnR5X3R3b19ieXRl[A-Za-z0-9+/=]*''',
            # OTLP/JSON attribute NAMES. Every attribute is written {"key":"<name>","value":...},
            # so a long dotted name (a2a.response.outcome, gen_ai.usage.input_tokens) trips
            # generic-api-key on the word `key`. Only lowercase dotted identifiers match (the
            # semantic-conventions shape), never a credential's; a secret VALUE next to it is still
            # scanned (krateo-platformops/observability#155, Diego 2026-11-11).
            '''key"\s*:\s*"[a-z][a-z0-9_]*(\.[a-z0-9_]+)+"''',
          ]
          [[allowlists]]
          description = "File names are not values"
          regexTarget = "secret"
          regexes = [
            # generic-api-key takes a name containing `secret`/`key` as the keyword and the next string
            # as the value. When that string is a plain file name it is a path, not a credential: e.g.
            # ("horizon-secret-key", "_90_krateo_secret_key.py") -- a Secret's name and the file it
            # holds (krateo-blueprints/krateo-openstack-blueprint#265, Diego 2026-11-14). Tested with
            # gitleaks 8.30.1: that line passes, high-entropy SECRET_KEY/api_key values are still caught.
            # Residual risk, accepted: a credential that literally ends in one of these extensions.
            '''^[A-Za-z0-9_.-]+\.(py|conf|cnf|ini|cfg|ya?ml|json|toml|sh|tpl)$''',
          ]
          [[allowlists]]
          description = "kagent-tools redaction-test fixture"
          # kagent-dev/tools internal/mcp/mcp_test.go declares a fake JWT-shaped constant to prove a
          # tool error never puts a credential on a span (upstream #107, ours). It is in upstream
          # history (8fd3465) and in krateo-agentiko/kagent-tools (7162d6d), so a fingerprint cannot
          # cover it. Scoped to that file AND that exact line shape (const secret, segments 17/11/3
          # after "eyJ"). The constant is being replaced upstream with a value that is not token-shaped.
          # Tested with gitleaks 8.30.1: both findings clear; a JWT-shaped value under another
          # const name in that file, or `const secret` in any other file, is still caught
          # (Diego 2026-11-16).
          condition = "AND"
          regexTarget = "line"
          paths = [
            '''(^|/)internal/mcp/mcp_test\.go$''',
          ]
          regexes = [
            '''^\s*const secret = "eyJ[A-Za-z0-9_-]{17}\.[A-Za-z0-9_-]{11}\.[A-Za-z0-9_-]{3}"\s*$''',
          ]
          [[allowlists]]
          description = "OpenStack-Helm's published libvirt secret UUID"
          # The UUID that names the libvirt secret every hypervisor defines for Ceph (cinder's rbd_secret_uuid,
          # libvirt's and nova's secret_uuid, the umbrella's libvirtSecretUUID in
          # krateo-blueprints/krateo-openstack-blueprint). It is an identifier, published in OpenStack-Helm's
          # cinder, nova and libvirt values; the secret's VALUE is a cephx key, which is never in values (#308).
          # Scoped to those four values files AND those keys AND that exact UUID: a different UUID under these
          # keys, or this UUID under any other key or in any other file, is still scanned. Tested with gitleaks
          # 8.30.1 in git mode, as this job scans (`gitleaks dir` skips a whole file on an AND allowlist's path
          # alone, so it cannot test this): the finding clears across every ref of a fresh clone; another UUID
          # under libvirtSecretUUID, a high-entropy key elsewhere in the same file, this UUID under another key,
          # and this line in another chart are still caught (Diego 2026-11-18, #308).
          condition = "AND"
          regexTarget = "line"
          paths = [
            '''(^|/)blueprints/(openstack|cinder|nova|libvirt)/chart/values\.yaml$''',
          ]
          regexes = [
            '''^\s*(libvirtSecretUUID|rbd_secret_uuid|secret_uuid):\s*"?457eb676-33da-42ec-9a8c-9293d545c337"?\s*$''',
          ]
          [[allowlists]]
          description = "kagent's controller test fixtures (krateo-agentiko/kagent-adk)"
          # Upstream kagent-dev/kagent's controller tests declare Kubernetes Secrets with fake values in
          # testdata/inputs/*.yaml (base64 of "sk-test-api-key", "testsecretkey", "pinecone-api-key",
          # "anthropic-api-key", "tool-secret-token", "sup3rs3cr3t", and public CA certs). They recur in
          # every commit of upstream's history that krateo-agentiko/kagent-adk carries, across the
          # directory moves below (97 findings), so a fingerprint cannot cover them. Scoped to those
          # five fixture directories and to YAML: testdata/outputs/, a subdirectory of inputs/, a
          # non-YAML file there, another translator directory, testdata/inputs/ elsewhere, and any other
          # file of the repo are still scanned. Residual risk, accepted as for the other fixture classes:
          # a real credential committed into one of these five directories would not be caught.
          # Tested with gitleaks 8.30.1 in git mode on a fresh clone (Diego 2026-11-21).
          paths = [
            '''(^|/)go/(core/)?(internal/)?controller/(internal/autogen|translator(/agent)?)/testdata/inputs/[^/]+\.ya?ml$''',
          ]
          TOML
          # --redact keeps the secret out of the log and must stay. But on its own the job prints
          # "leaks found: N" and nothing else -- not the rule, the file, or the fingerprint -- so a
          # recurrence cannot be diagnosed from CI at all (#32). The JSON report carries the
          # identifying fields while the value stays redacted: we can name the finding without
          # ever printing it.
          set +e
          ./gitleaks detect --source=. --config=/tmp/krateo-gitleaks.toml --redact --no-banner \
            --exit-code=1 --report-format json --report-path /tmp/gitleaks.json
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            if [ -s /tmp/gitleaks.json ]; then
              echo "::error::gitleaks found $(jq -r 'length' /tmp/gitleaks.json) finding(s); identifying fields only, values stay redacted:"
              jq -r '.[] | "  \(.RuleID)  \(.File):\(.StartLine)  fingerprint=\(.Fingerprint)"' /tmp/gitleaks.json
              echo "::error::Rotate a live credential first, and never allowlist one that is still in use. Then: a finding ONLY IN HISTORY (already fixed forward) is accepted with its fingerprint above in the repository's .gitleaksignore, with a # comment giving the reason; a commit never changes, so that fingerprint never stops matching. A value that RECURS in the working tree (a published upstream constant, a vendored default) belongs in this workflow's allowlist by path or pattern instead, because its fingerprint (commit:file:rule:line) changes whenever the line moves."
            else
              # A non-zero exit with no report is NOT a clean scan and must not read as one: it means
              # gitleaks could not run (bad config, failed download). Say which it was, or a broken
              # scanner is indistinguishable from a passing one.
              echo "::error::gitleaks exited $rc and produced NO report -- the scan did not complete. This is a failed MEASUREMENT, not a clean result."
            fi
            exit "$rc"
          fi

  # --- SAST via CodeQL (Go and/or JS/TS) ---
  codeql:
    needs: detect
    if: needs.detect.outputs.go == 'true' || needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON( format('[{0}{1}{2}]',
          needs.detect.outputs.go == 'true' && '"go"' || '',
          (needs.detect.outputs.go == 'true' && needs.detect.outputs.node == 'true') && ',' || '',
          needs.detect.outputs.node == 'true' && '"javascript-typescript"' || '' ) ) }}
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        continue-on-error: true   # result upload unavailable on private repos without GHAS
        with:
          category: "/language:${{ matrix.language }}"

  # --- Go: vulnerable-deps + gosec ---
  go:
    needs: detect
    if: needs.detect.outputs.go == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mod: ${{ fromJSON(needs.detect.outputs.gomods) }}
    defaults:
      run:
        working-directory: ${{ matrix.mod }}
    steps:
      - uses: actions/checkout@v4
      # v6, not v5: v6 reads go.mod's `toolchain` line and v5 reads only `go`. govulncheck reports
      # standard-library vulnerabilities against the Go it runs on. Under v5 a module at
      # `go 1.26.0` + `toolchain go1.26.10` was scanned on 1.26.0 and listed ~36 stdlib findings
      # that its 1.26.10 builds do not have (krateo-platformops/provider-runtime#19).
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.mod }}/go.mod
      # `@latest` TOOK EVERY GO REPO'S CI DOWN ORG-WIDE on 2026-10-28. x/vuln v1.9.0 became
      # `@latest` and declares `go 1.26.0`, so under GOTOOLCHAIN=local the INSTALL failed:
      #   go: golang.org/x/vuln/cmd/govulncheck@latest: golang.org/x/vuln@v1.9.0 requires
      #       go >= 1.26.0 (running go 1.24.0; GOTOOLCHAIN=local)
      # Nothing in any repo had changed. An unpinned dependency in CI is the defect, so the tool
      # version is now explicit.
      #
      # PINNING ALONE WAS NOT AN OPTION, which is worth recording so nobody "simplifies" it back.
      # Every x/vuln release from v1.2.0 onward requires Go >= 1.25 (v1.8.0 and v1.9.0 require
      # 1.26), so the newest version installable under a `go 1.24` module is v1.1.x -- a scanner
      # two years stale. And there is no "raise the workflow's Go": `go-version-file` above means
      # the Go version comes from EACH CONSUMING REPO's go.mod, so this workflow has none of its
      # own to raise.
      #
      # GOTOOLCHAIN IS SCOPED TO THE INSTALL COMMAND, NOT SET AS A STEP-LEVEL `env:`, AND THAT IS
      # LOAD-BEARING. The comment above explains that govulncheck reports standard-library
      # vulnerabilities against the Go it RUNS ON -- that is why setup-go@v6 reads the module's
      # `toolchain` line. A step-level GOTOOLCHAIN would let the SCAN select a newer toolchain
      # too, re-reporting stdlib findings the module's own builds do not have, which is exactly
      # krateo-platformops/provider-runtime#19. Only the install may use a different toolchain;
      # the scan must stay on the module's.
      #
      # `|| true` STAYS ON THE SCAN AND MUST NEVER BE ADDED TO THE INSTALL. The scan is
      # deliberately non-gating. A failing install, by contrast, is CI telling the truth: silencing
      # it would leave a scan that reports nothing while looking green, and there are real findings
      # behind this check -- core-provider measured 39 CALLED stdlib vulnerabilities on
      # golang:1.26.0 and 0 on 1.26.10.
      #
      # The install and the module download go through the go-download action, which retries
      # ONLY transient network errors (a dropped proxy.golang.org stream failed this job in
      # provider-runtime on 2026-10-28). A real install failure, like the x/vuln one above, still
      # fails on the first attempt, so the "never silence the install" rule holds.
      - name: Download modules
        uses: krateo-platformops/.github/.github/actions/go-download@88eaff13555233606da5ff3ff3bfed8f534436ce # main 2026-11-18
        with:
          working-directory: ${{ matrix.mod }}
      - name: Install govulncheck
        uses: krateo-platformops/.github/.github/actions/go-download@88eaff13555233606da5ff3ff3bfed8f534436ce # main 2026-11-18
        with:
          working-directory: ${{ matrix.mod }}
          run: GOTOOLCHAIN=auto go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      # BOUNDED, because on a large module the scan can starve the runner itself: on
      # krateo-agentiko/kagent-adk (upstream kagent's whole module: controller, CLI, agent runtime,
      # Kubernetes deps) 2 of 3 runs ended after 46 min with "The hosted runner lost communication
      # with the server" inside this step, and no result. GOMEMLIMIT is a soft limit for the Go GC,
      # derived from THIS runner's memory (public and private repos get different runner sizes), so
      # the scan collects harder instead of exhausting the host; it changes nothing about what is
      # scanned or reported. timeout-minutes turns a scan that still cannot finish into a clear
      # step failure instead of a lost runner.
      - name: govulncheck
        timeout-minutes: 40
        run: |
          mem_kib=$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)
          export GOMEMLIMIT="$(( mem_kib * 7 / 10 ))KiB"
          echo "runner MemTotal ${mem_kib} KiB, nproc $(nproc); GOMEMLIMIT=${GOMEMLIMIT}"
          govulncheck ./... || true   # report first; drop `|| true` to gate
      - name: gosec (SARIF)
        uses: securego/gosec@master
        with: { args: "-no-fail -fmt sarif -out gosec.sarif ${{ matrix.mod }}/..." }

      - name: otel-audit (OTel adherence + semconv + audit-signal + deps)
        # Audits deployable Go components for OTel observability adherence (self-skips libs & non-OTel repos).
        env:
          OTEL_AUDIT_GATE: "0"   # report-first; set to 1 to gate CI once components are baselined
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          echo '' | base64 -d > /tmp/otel-audit.py
          python3 /tmp/otel-audit.py
      - uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true   # code-scanning upload unavailable on private repos without GHAS
        with: { sarif_file: gosec.sarif, category: gosec }

  # --- Node/TS: dependency audit ---
  node:
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - name: Dependency audit
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable && pnpm i --frozen-lockfile --ignore-scripts && pnpm audit --audit-level=high || true
          else
            npm ci --ignore-scripts || npm i --ignore-scripts
            npm audit --audit-level=high || true
          fi

  # --- Helm charts: lint + policy + IaC ---
  chart:
    needs: detect
    if: needs.detect.outputs.chart == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          # The helm every chart workflow here pins (release-oci, chart-images). Unset, setup-helm installs "latest".
          version: v3.19.0
      - name: helm lint
        run: |
          for c in $(git ls-files '**/Chart.yaml' 'Chart.yaml' | xargs -n1 dirname | sort -u); do
            echo "== helm lint $c =="; helm lint "$c" || true
          done
      - name: kube-linter
        uses: stackrox/kube-linter-action@v1
        with: { directory: . }
        continue-on-error: true

  # --- SBOM (always) + optional image scan ---
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # syft is installed here rather than by anchore/sbom-action, which downloads it anonymously
      # with no retry and so failed this job under GitHub's 2026-11-09 incident. Same tool and
      # version the action used (v1.42.3), fetched with the job's token, retried on transient
      # errors only, and checked against the release's sha256 file.
      - name: Download syft
        id: syft
        uses: krateo-platformops/.github/.github/actions/release-download@88eaff13555233606da5ff3ff3bfed8f534436ce # main 2026-11-18
        with:
          repo: anchore/syft
          tag: v1.42.3
          asset: syft_1.42.3_linux_amd64.tar.gz
          checksums: syft_1.42.3_checksums.txt
      - name: Generate SBOM (SPDX)
        run: |
          tar -xzf "${{ steps.syft.outputs.path }}" -C "$RUNNER_TEMP" syft
          "$RUNNER_TEMP/syft" scan dir:. -o spdx-json=sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom.spdx.json }
      - name: Trivy image scan (optional)
        if: inputs.image-ref != ''
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ inputs.image-ref }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
      - name: Upload image SARIF
        if: inputs.image-ref != ''
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true   # code-scanning upload unavailable on private repos without GHAS
        with: { sarif_file: trivy-image.sarif, category: trivy-image }

  # --- cosign keyless signing: enable per repo that publishes images (see README) ---
  # sign:
