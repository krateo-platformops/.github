# Reusable security workflow for Krateo repos.
# HOST THIS AT:  krateo-platformops/.github/.github/workflows/security.yml   (org-level reusable)
#   (or a dedicated krateo-platformops/krateo-ci repo — NOT `plumbing`, which is a Go module
#    imported by only some repos and so can't reach the chart/TS repos.)
#
# Each repo pulls it in with a ~10-line caller (see ../caller.security.yml).
# Auto-detects Go / Node / Helm-chart / Dockerfile — callers usually need NO inputs.
name: security

on:
  workflow_call:
    inputs:
      go-version:
        type: string
        default: "1.23"
      node-version:
        type: string
        default: "20"
      image-ref:
        description: "Optional built image to scan/sign (e.g. ghcr.io/krateo-platformops/foo:tag). Empty = skip image scan."
        type: string
        default: ""

permissions:
  contents: read
  security-events: write   # upload SARIF to GitHub code scanning
  actions: read            # gitleaks-action reads workflow-run metadata
  pull-requests: read      # gitleaks-action lists PR commits on pull_request events

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.d.outputs.go }}
      gomods: ${{ steps.d.outputs.gomods }}
      node: ${{ steps.d.outputs.node }}
      chart: ${{ steps.d.outputs.chart }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        shell: bash
        run: |
          mods=$(find . -maxdepth 3 -name go.mod -not -path "*/vendor/*" -not -path "*/.git/*" | xargs -r -n1 dirname | sed "s#^\./##" | sort -u | jq -R . | jq -sc .)
          [ -z "$mods" ] && mods="[]"
          [ "$mods" = "[]" ] && echo "go=false" >> "$GITHUB_OUTPUT" || echo "go=true" >> "$GITHUB_OUTPUT"
          echo "gomods=$mods" >> "$GITHUB_OUTPUT"
          echo "node=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [ -n "$(git ls-files 'Chart.yaml' '**/Chart.yaml')" ]; then
            echo "chart=true" >> "$GITHUB_OUTPUT"; else echo "chart=false" >> "$GITHUB_OUTPUT"; fi

  # --- Repo-wide: dependency + IaC + secret scanning (all repos) ---
  filesystem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Trivy (vuln + misconfig + secrets)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"        # REPORT-ONLY: uploads every CRITICAL+HIGH finding to code-scanning for
                                # visibility, never fails. Enforcement is the gate step below.
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true   # code-scanning upload unavailable on private repos without GHAS
        with: { sarif_file: trivy-fs.sarif, category: trivy-fs }
      - name: Trivy gate (CRITICAL — enforced)
        # ENFORCEMENT: fails the (required) `security / filesystem` check on any CRITICAL vuln/secret/
        # misconfig, so a critical cannot merge (org admins bypass). Scoped to CRITICAL first — HIGH
        # stays report-only above until the fleet is baselined, then bump `severity` here to
        # CRITICAL,HIGH. `ignore-unfixed` drops CRITICAL vulns that have no available fix.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret        # gate on CRITICAL CVEs + secrets only; misconfig (KSV) stays
                                        # report-only in the step above (mostly example/dev manifests —
                                        # add misconfig here once those are cleaned/allowlisted)
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Gitleaks (secret scan)
        # gitleaks-action@v2 charges ORG-owned repos; the gitleaks TOOL is MIT/free. Install the binary
        # and scan in GIT mode (commit history). NOTE: --no-git wrongly scans .git/ pack files as plain
        # data (slow + false positives); git mode on the runner-owned checkout is correct + fast.
        run: |
          ver="$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" \
                  https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
                  | grep -oE '"tag_name": *"v[0-9.]+"' | grep -oE 'v[0-9.]+' | head -1)"
          ver="${ver:-v8.30.1}"; v="${ver#v}"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/${ver}/gitleaks_${v}_linux_x64.tar.gz" | tar -xz gitleaks
          # Shared allowlist: documentation, generated API specs, vendored subcharts, sample
          # manifests, Helm template partials and JSON schemas are not secret stores; they trip
          # the generic-api-key / entropy heuristics on example identifiers and template syntax.
          # Real secrets in source (values.yaml, code, config) are still caught. Repo-specific
          # accepted findings live in a repo-level .gitleaksignore (also honoured below) -- which is
          # for GENUINELY ONE-OFF cases only. A finding that recurs (a published upstream constant, a
          # vendored default) must be allowlisted by path or pattern ABOVE instead: a fingerprint is
          # commit:file:rule:line and survives nothing, where a pattern survives a line moving (#32).
          cat > /tmp/krateo-gitleaks.toml <<'TOML'
          title = "krateo-gitleaks"
          [extend]
          useDefault = true
          [[allowlists]]
          description = "Non-secret file classes"
          paths = [
            '''(^|/)docs/''',
            '''(^|/)examples/''',
            '''(^|/)quickstart/''',
            '''(^|/)samples?/''',
            '''(^|/)generated/''',
            '''(^|/)oas/''',
            '''(^|/)charts/''',
            '''helm-toolkit/''',
            '''\.md$''',
            '''\.tpl$''',
            '''values\.schema\.json$''',
          ]
          [[allowlists]]
          description = "Published upstream constants: documented defaults shipped BY the vendor chart"
          # Keyed on the LINE, not the matched value: the key name is the stable property and the
          # upstream default's value can change. Keyed here rather than in a repo .gitleaksignore
          # because a fingerprint is commit:file:rule:line and stops matching the moment the line
          # moves -- a re-vendor, or inserting a line above it, resurfaces a long-accepted finding
          # as a FRESH leak indistinguishable from a real one (#32).
          regexTarget = "line"
          regexes = [
            '''horizon_secret_key''',
          ]
          [[allowlists]]
          description = "Well-known non-secret placeholder/example values"
          regexTarget = "match"
          regexes = [
            '''REPLACE_WITH_[A-Z0-9_]+''',
            '''(?i)changeme|example|placeholder|dummy|redacted|your[-_]?(key|token|secret|password)''',
            '''dGhpcnR5X3R3b19ieXRl[A-Za-z0-9+/=]*''',
          ]
          TOML
          # --redact keeps the secret out of the log and must stay. But on its own the job prints
          # "leaks found: N" and nothing else -- not the rule, the file, or the fingerprint -- so a
          # recurrence cannot be diagnosed from CI at all (#32). The JSON report carries the
          # identifying fields while the value stays redacted: we can name the finding without
          # ever printing it.
          set +e
          ./gitleaks detect --source=. --config=/tmp/krateo-gitleaks.toml --redact --no-banner \
            --exit-code=1 --report-format json --report-path /tmp/gitleaks.json
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            if [ -s /tmp/gitleaks.json ]; then
              echo "::error::gitleaks found $(jq -r 'length' /tmp/gitleaks.json) finding(s); identifying fields only, values stay redacted:"
              jq -r '.[] | "  \(.RuleID)  \(.File):\(.StartLine)  fingerprint=\(.Fingerprint)"' /tmp/gitleaks.json
              echo "::error::A published upstream constant that RECURS belongs in this workflow's allowlist by path or pattern, not in a repo .gitleaksignore whose commit:file:rule:line fingerprint stops matching when the line moves."
            else
              # A non-zero exit with no report is NOT a clean scan and must not read as one: it means
              # gitleaks could not run (bad config, failed download). Say which it was, or a broken
              # scanner is indistinguishable from a passing one.
              echo "::error::gitleaks exited $rc and produced NO report -- the scan did not complete. This is a failed MEASUREMENT, not a clean result."
            fi
            exit "$rc"
          fi

  # --- SAST via CodeQL (Go and/or JS/TS) ---
  codeql:
    needs: detect
    if: needs.detect.outputs.go == 'true' || needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON( format('[{0}{1}{2}]',
          needs.detect.outputs.go == 'true' && '"go"' || '',
          (needs.detect.outputs.go == 'true' && needs.detect.outputs.node == 'true') && ',' || '',
          needs.detect.outputs.node == 'true' && '"javascript-typescript"' || '' ) ) }}
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        continue-on-error: true   # result upload unavailable on private repos without GHAS
        with:
          category: "/language:${{ matrix.language }}"

  # --- Go: vulnerable-deps + gosec ---
  go:
    needs: detect
    if: needs.detect.outputs.go == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mod: ${{ fromJSON(needs.detect.outputs.gomods) }}
    defaults:
      run:
        working-directory: ${{ matrix.mod }}
    steps:
      - uses: actions/checkout@v4
      # v6, not v5: v6 reads go.mod's `toolchain` line and v5 reads only `go`. govulncheck reports
      # standard-library vulnerabilities against the Go it runs on. Under v5 a module at
      # `go 1.26.0` + `toolchain go1.26.10` was scanned on 1.26.0 and listed ~36 stdlib findings
      # that its 1.26.10 builds do not have (krateo-platformops/provider-runtime#19).
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.mod }}/go.mod
      # `@latest` TOOK EVERY GO REPO'S CI DOWN ORG-WIDE on 2026-10-28. x/vuln v1.9.0 became
      # `@latest` and declares `go 1.26.0`, so under GOTOOLCHAIN=local the INSTALL failed:
      #   go: golang.org/x/vuln/cmd/govulncheck@latest: golang.org/x/vuln@v1.9.0 requires
      #       go >= 1.26.0 (running go 1.24.0; GOTOOLCHAIN=local)
      # Nothing in any repo had changed. An unpinned dependency in CI is the defect, so the tool
      # version is now explicit.
      #
      # PINNING ALONE WAS NOT AN OPTION, which is worth recording so nobody "simplifies" it back.
      # Every x/vuln release from v1.2.0 onward requires Go >= 1.25 (v1.8.0 and v1.9.0 require
      # 1.26), so the newest version installable under a `go 1.24` module is v1.1.x -- a scanner
      # two years stale. And there is no "raise the workflow's Go": `go-version-file` above means
      # the Go version comes from EACH CONSUMING REPO's go.mod, so this workflow has none of its
      # own to raise.
      #
      # GOTOOLCHAIN IS SCOPED TO THE INSTALL COMMAND, NOT SET AS A STEP-LEVEL `env:`, AND THAT IS
      # LOAD-BEARING. The comment above explains that govulncheck reports standard-library
      # vulnerabilities against the Go it RUNS ON -- that is why setup-go@v6 reads the module's
      # `toolchain` line. A step-level GOTOOLCHAIN would let the SCAN select a newer toolchain
      # too, re-reporting stdlib findings the module's own builds do not have, which is exactly
      # krateo-platformops/provider-runtime#19. Only the install may use a different toolchain;
      # the scan must stay on the module's.
      #
      # `|| true` STAYS ON THE SCAN AND MUST NEVER BE ADDED TO THE INSTALL. The scan is
      # deliberately non-gating. A failing install, by contrast, is CI telling the truth: silencing
      # it would leave a scan that reports nothing while looking green, and there are real findings
      # behind this check -- core-provider measured 39 CALLED stdlib vulnerabilities on
      # golang:1.26.0 and 0 on 1.26.10.
      - name: govulncheck
        run: |
          GOTOOLCHAIN=auto go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./... || true   # report first; drop `|| true` to gate
      - name: gosec (SARIF)
        uses: securego/gosec@master
        with: { args: "-no-fail -fmt sarif -out gosec.sarif ${{ matrix.mod }}/..." }

      - name: otel-audit (OTel adherence + semconv + audit-signal + deps)
        # Audits deployable Go components for OTel observability adherence (self-skips libs & non-OTel repos).
        env:
          OTEL_AUDIT_GATE: "0"   # report-first; set to 1 to gate CI once components are baselined
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          echo '' | base64 -d > /tmp/otel-audit.py
          python3 /tmp/otel-audit.py
      - uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true   # code-scanning upload unavailable on private repos without GHAS
        with: { sarif_file: gosec.sarif, category: gosec }

  # --- Node/TS: dependency audit ---
  node:
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - name: Dependency audit
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable && pnpm i --frozen-lockfile --ignore-scripts && pnpm audit --audit-level=high || true
          else
            npm ci --ignore-scripts || npm i --ignore-scripts
            npm audit --audit-level=high || true
          fi

  # --- Helm charts: lint + policy + IaC ---
  chart:
    needs: detect
    if: needs.detect.outputs.chart == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: |
          for c in $(git ls-files '**/Chart.yaml' 'Chart.yaml' | xargs -n1 dirname | sort -u); do
            echo "== helm lint $c =="; helm lint "$c" || true
          done
      - name: kube-linter
        uses: stackrox/kube-linter-action@v1
        with: { directory: . }
        continue-on-error: true

  # --- SBOM (always) + optional image scan ---
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with: { path: ".", format: spdx-json, output-file: sbom.spdx.json }
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom.spdx.json }
      - name: Trivy image scan (optional)
        if: inputs.image-ref != ''
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ inputs.image-ref }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
      - name: Upload image SARIF
        if: inputs.image-ref != ''
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true   # code-scanning upload unavailable on private repos without GHAS
        with: { sarif_file: trivy-image.sarif, category: trivy-image }

