# Reusable: THE canonical multi-platform image build for every krateo-* code repo — flat, folded,
# or monorepo, there is ONE shape. The caller passes a `modules` JSON list (one element per image);
# the matrix lives HERE, so a single-image repo (1 element) and a monorepo (N elements) call this the
# exact same way. Image name is always ghcr.io/<owner>/<mod>. Used by release-tag (push:true) and
# release-pullrequest (push:false).
name: component-image-build

on:
  workflow_call:
    inputs:
      modules:
        description: 'JSON array of images: [{"mod":"<name>","context":"<dir>","dockerfile":"<opt>"}]. 1 element = single-image repo; N = monorepo.'
        type: string
      platforms:
        description: "Target platforms for the manifest list."
        type: string
        default: "linux/amd64,linux/arm64"
      build_args:
        description: "Extra docker build args (newline-separated KEY=VALUE); applied to every module."
        type: string
        default: ""
      push:
        description: "Push (true for release tags; false for PR validate-only builds)."
        type: boolean
        default: true

jobs:
  build:
    name: Build & push image (multi-platform)
    strategy:
      # One module's failure must not cancel the others. Default fail-fast cancels every in-flight
      # matrix leg on the first failure, so in a monorepo a problem confined to ONE image (a GHCR
      # permission_denied on its package, a broken Dockerfile) takes out the healthy images too and
      # the tag publishes NOTHING. Observed on oasgen-provider 0.21.0: rest-dynamic-controller could
      # not push, which cancelled the already-succeeding oasgen-provider build. Independent images
      # are independent — let each one report its own verdict.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.modules) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Only the tag-on-main guard needs history; a shallow tip cannot answer "is this on main".
          fetch-depth: ${{ (inputs.push && startsWith(github.ref, 'refs/tags/')) && 0 || 1 }}

      # A release tag must point at a commit contained in main. A tag cut from a side branch would
      # publish an IMAGE built from code that was never merged, under a version number implying it
      # was — and the published image is indistinguishable from a legitimate one afterwards.
      #
      # Only guards pushing tag builds: PR validation (push: false) has nothing to protect.
      - name: Assert the tag is on main
        if: ${{ inputs.push && startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          # Compare against FETCH_HEAD, not origin/main. The remote-tracking ref exists only if the
          # checkout configured a matching refspec; FETCH_HEAD is written by the fetch itself. Were
          # origin/main missing, merge-base would die with "unknown revision" and block EVERY release
          # rather than only the ones this guard exists to stop.
          git fetch --no-tags --quiet origin main
          if git merge-base --is-ancestor "${GITHUB_SHA}" FETCH_HEAD; then
            echo "OK: ${GITHUB_REF_NAME} (${GITHUB_SHA}) is contained in main"
          else
            echo "::error::tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is NOT contained in main."
            echo "::error::Release tags must be cut from main. Merge the branch first, then re-tag the merge commit."
            exit 1
          fi

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.mod }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile != '' && matrix.dockerfile || format('{0}/Dockerfile', matrix.context) }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build_args }}
          # Supply-chain attestations stay ON. A SINGLE buildx call emits the whole manifest list
          # (both platforms + their provenance/SBOM) as one coherent OCI image index, so the
          # attestations attach cleanly — the "same arch, two digests" ambiguity only ever came from
          # the build-by-digest + `imagetools create` merge path (each per-arch build pushed an index
          # of image + attestation, and merging those indexes duplicated/confused platform entries).
          # We keep the single build here, so provenance + sbom are safe to keep enabled.
          provenance: true
          sbom: true
          # BuildKit layer cache in GitHub Actions cache, scoped per module (the scope keeps a
          # monorepo's images from clobbering each other's cache). Without this EVERY build was cold:
          # a tag build re-ran the whole emulated linux/arm64 `npm ci` + build from scratch (~25 min
          # observed on frontend). With mode=max the intermediate `npm ci`/deps layers are cached too,
          # so an unchanged-dependency build reuses them and only rebuilds what actually changed. The
          # cache is per-arch inside one entry (buildkit keys layers by platform), so it warms both
          # the amd64 and the emulated arm64 legs.
          cache-from: type=gha,scope=${{ matrix.mod }}
          cache-to: type=gha,mode=max,scope=${{ matrix.mod }}

      - name: Inspect image (verify multi-arch manifest)
        if: ${{ inputs.push }}
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/${{ matrix.mod }}:${{ steps.meta.outputs.version }}
