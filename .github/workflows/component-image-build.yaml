# Reusable: THE canonical multi-platform component image build. One source of truth for the
# "build & push image" step across every krateo-* code repo — call it from each repo's
# release-tag.yaml so the multi-arch build can never drift per-repo again (the frontend
# amd64-only regression is exactly what this prevents). Per-repo variation is expressed via
# inputs; the CRD-publish step stays in each repo's release-tag.yaml because it genuinely
# differs (Go `make generate` vs frontend's npm/krateoctl).
name: component-image-build

on:
  workflow_call:
    inputs:
      context:
        description: "Docker build context (e.g. go/snowplow, go/core-provider, ui)."
        type: string
        default: "."
      dockerfile:
        description: "Dockerfile path. Empty => <context>/Dockerfile."
        type: string
        default: ""
      platforms:
        description: "Target platforms for the manifest list."
        type: string
        default: "linux/amd64,linux/arm64"
      build_args:
        description: "Extra docker build args (newline-separated KEY=VALUE)."
        type: string
        default: ""

jobs:
  build:
    name: Build & push image (multi-platform)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # QEMU is required for the non-native (arm64) leg of the multi-platform build.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile != '' && inputs.dockerfile || format('{0}/Dockerfile', inputs.context) }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build_args }}

      - name: Inspect image (verify multi-arch manifest)
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
