# Reusable: THE canonical multi-platform component image build. One source of truth for the
# "build & push image" step across every krateo-* code repo — called from release-tag.yaml
# (push: true) AND from release-pullrequest.yaml (push: false, validate-only). Per-repo
# variation via inputs; the CRD-publish step stays in each repo's release-tag.yaml.
name: component-image-build

on:
  workflow_call:
    inputs:
      context:
        description: "Docker build context (e.g. go/snowplow, go/authn, ui)."
        type: string
        default: "."
      dockerfile:
        description: "Dockerfile path. Empty => <context>/Dockerfile."
        type: string
        default: ""
      platforms:
        description: "Target platforms for the manifest list."
        type: string
        default: "linux/amd64,linux/arm64"
      build_args:
        description: "Extra docker build args (newline-separated KEY=VALUE)."
        type: string
        default: ""
      push:
        description: "Push the image (true for release tags; false for PR validate-only builds)."
        type: boolean
        default: true

jobs:
  build:
    name: Build & push image (multi-platform)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile != '' && inputs.dockerfile || format('{0}/Dockerfile', inputs.context) }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build_args }}

      - name: Inspect image (verify multi-arch manifest)
        if: ${{ inputs.push }}
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
