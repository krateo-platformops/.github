# Reusable: canonical Go PR checks (unit tests + optional CRD-drift guard) for every krateo-* Go
# code repo — called from release-pullrequest.yaml. Runs from the module dir so it survives the
# go/<repo> monorepo fold (root-relative CI is exactly what broke after the fold).
name: component-go-checks

on:
  workflow_call:
    inputs:
      module:
        description: "Go module directory (e.g. go/authn). go.mod, Makefile and crds/ live here."
        type: string
        default: "."
      crd_drift:
        description: "Run the CRD-drift guard (make generate + git diff crds/) from the module dir."
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ inputs.module }}/go.mod
      - name: Gather dependencies
        working-directory: ${{ inputs.module }}
        run: go mod download
      - name: Run coverage
        working-directory: ${{ inputs.module }}
        run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          working-directory: ${{ inputs.module }}

  crds-drift:
    name: CRDs drift guard
    if: ${{ inputs.crd_drift }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ inputs.module }}/go.mod
      - name: Regenerate CRDs
        working-directory: ${{ inputs.module }}
        run: make generate
      - name: Fail on stale CRDs
        working-directory: ${{ inputs.module }}
        run: |
          if ! git diff --exit-code crds/; then
            echo "::error::Committed CRDs in crds/ are stale. Run 'make generate' and commit the result." >&2
            exit 1
          fi
          echo "CRDs are up to date."
