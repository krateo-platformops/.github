# Reusable: canonical Go PR checks (unit tests + optional CRD-drift guard) for every krateo-* Go
# code repo — called from release-pullrequest.yaml. Runs from the module dir so it survives the
# go/<repo> monorepo fold. The test invocation is passed verbatim via `test_args` so each repo keeps
# its exact behavior (build tags, timeouts, -coverpkg, …) while sharing ONE workflow.
name: component-go-checks

on:
  workflow_call:
    inputs:
      module:
        description: "Go module directory (e.g. go/authn). go.mod, Makefile and crds/ live here."
        type: string
        default: "."
      crd_drift:
        description: "Run the CRD-drift guard (make generate + git diff crds/) from the module dir."
        type: boolean
        default: false
      test_args:
        description: "Args appended to `go test` (verbatim). Set per repo to preserve tags/flags."
        type: string
        default: "-race -coverprofile=coverage.txt -covermode=atomic ./..."
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ inputs.module }}/go.mod
      - name: Gather dependencies
        working-directory: ${{ inputs.module }}
        run: go mod download
      - name: Run coverage
        working-directory: ${{ inputs.module }}
        run: go test ${{ inputs.test_args }}
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          working-directory: ${{ inputs.module }}

  crds-drift:
    name: CRDs drift guard
    if: ${{ inputs.crd_drift }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ inputs.module }}/go.mod
      - name: Regenerate CRDs
        working-directory: ${{ inputs.module }}
        run: make generate
      # Diff the WHOLE tree, not just <module>/crds/. Generated CRDs frequently have to exist in more
      # than one place -- the chart that versions and ships them, an envtest fixture -- and a guard
      # scoped to the generator's own output directory passes while those copies rot. The copy users
      # install is usually the one furthest from the generator, so it is the one most likely to be
      # missed and the most damaging when it is.
      #
      # Observed in oasgen-provider: `make generate` updated crds/ alone while the shipped CRD chart
      # kept a stale enum, with this guard green. Had it merged, the fix would have reached every file
      # except the one users install (krateo-platformops/oasgen-provider#84).
      #
      # This deliberately does not take a list of extra paths. A path list is itself a copy that falls
      # behind when a destination is added; diffing the tree covers whatever `make generate` writes, by
      # construction, in every repo that calls this.
      #
      # go.mod/go.sum are excluded because `make generate` runs `go mod tidy` in most repos, and that
      # churn is not CRD drift -- failing on it would be noise and would push repos to stop calling
      # this guard.
      - name: Fail on stale generated artifacts
        run: |
          if ! git diff --exit-code -- . ':(exclude)**/go.mod' ':(exclude)**/go.sum'; then
            echo "::error::Generated artifacts are stale. Run 'make generate' in ${{ inputs.module }} and commit the result, including any copies it syncs (chart templates, test fixtures)." >&2
            exit 1
          fi
          echo "Generated artifacts are up to date."
