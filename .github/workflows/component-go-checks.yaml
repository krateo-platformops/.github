# Reusable: canonical Go PR checks (static analysis, unit tests, optional CRD-drift guard) for every krateo-* Go
# code repo — called from release-pullrequest.yaml. Runs from the module dir so it survives the
# go/<repo> monorepo fold. The test invocation is passed verbatim via `test_args` so each repo keeps
# its exact behavior (build tags, timeouts, -coverpkg, …) while sharing ONE workflow.
name: component-go-checks

on:
  workflow_call:
    inputs:
      module:
        description: "Go module directory (e.g. go/authn). go.mod, Makefile and crds/ live here."
        type: string
        default: "."
      crd_drift:
        description: "Run the CRD-drift guard (make generate + git diff crds/) from the module dir."
        type: boolean
        default: false
      test_args:
        description: "Args appended to `go test` (verbatim). Set per repo to preserve tags/flags."
        type: string
        default: "-race -coverprofile=coverage.txt -covermode=atomic ./..."
      vet:
        description: "Run `go vet ./...` from the module dir."
        type: boolean
        default: true
      fmt_check:
        description: >-
          Fail when `gofmt -l` reports files. Opt-in per repo: turn it on once the module is clean,
          so enabling the check and paying off a formatting backlog stay separate commits.
        type: boolean
        default: false
      tidy_check:
        description: >-
          Fail when `go mod tidy` would change go.mod/go.sum. Opt-in. Aimed at monorepos whose
          modules `replace` each other by path, where a dependency bump in one module silently
          invalidates a sibling's go.sum.
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  # Deliberately a SEPARATE job from `test`, not extra steps in it. As steps, a formatting nit
  # would fail the job before `go test` ran and hide every test result behind whitespace; as its
  # own job both signals land on the PR at once, and neither masks the other.
  #
  # NOTE this is not a PR-only check. Of the 7 call sites, two are release gates --
  # core-provider/release-tag.yaml and oasgen-provider/test.yaml -- where a caller job feeds
  # `needs:` for the image build. A failure here therefore blocks a release, not just a merge.
  # That is deliberate for `vet`: it is fast, deterministic and offline, which is the same bar
  # release-tag.yaml already applies when it excludes the kind-based integration tests from the
  # tag path. It is a further argument for keeping `fmt_check` opt-in: whitespace should not be
  # able to stand between a tag and its artifacts in a repo that has not chosen that.
  static:
    name: static analysis
    if: ${{ inputs.vet || inputs.fmt_check }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ inputs.module }}/go.mod

      # gofmt is opt-in because the fleet is not uniformly clean, and flipping one shared reusable
      # would red-tick every PR in the repos that are not. Measured 2026-10-02 across all five
      # callers: helm-render-service, authn and oasgen-provider clean; core-provider 8 files;
      # snowplow 134 files / 1887 lines (hand-written, none generated). Those two want a cleanup
      # commit of their own first. Flip the default to true once the fleet is clean.
      - name: gofmt
        if: ${{ inputs.fmt_check }}
        working-directory: ${{ inputs.module }}
        run: |
          set -uo pipefail
          # (^|/)vendor/ -- NOT '/vendor/'. gofmt -l prints paths relative to the module dir, so a
          # root-level vendor/ has no leading slash and a '/vendor/' filter silently misses it.
          # No caller vendors today; this is here so the first one that does does not get noise.
          unformatted=$(gofmt -l . | grep -vE '(^|/)vendor/' || true)

          # Assert the check FOUND something to look at. `gofmt -l` over a directory with no .go
          # files prints nothing and exits 0 -- identical to "everything is formatted". A wrong
          # `module` input would therefore pass this step while examining zero files, and the green
          # tick would mean nothing. Fail loudly instead.
          examined=$(find . -name '*.go' -not -path '*/vendor/*' | grep -c . || true)
          if [ "$examined" -eq 0 ]; then
            echo "::error::gofmt examined 0 .go files under '${{ inputs.module }}'. Check the module input -- a check that inspects nothing passes for the wrong reason." >&2
            exit 1
          fi

          # "until gofmt -l is empty", not "run it once": gofmt -w is not always idempotent in a
          # single pass. Reproduced on go1.25.1 against core-provider's crdwatch_envtest_test.go --
          # the doc-comment reflow inserts list separators, and formatting the result reflows it
          # again. One pass leaves the file still listed, two converge. A contributor who runs it
          # once, sees no further diff and pushes would otherwise get a red tick they cannot explain.
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite these files. In ${{ inputs.module }}, run 'gofmt -w .' until 'gofmt -l .' prints nothing (doc comments can need two passes), then commit." >&2
            printf '%s\n' "$unformatted" >&2
            exit 1
          fi
          echo "gofmt: clean ($examined .go files examined)"

      # vet defaults ON: measured clean in all 8 modules across all 5 callers on 2026-10-02, so
      # there is no backlog to pay off and nothing to stage. Unlike gofmt it reports real defects
      # rather than whitespace, which is why it is worth having on by default and why the escape
      # hatch exists only for a repo that hits a false positive.
      - name: go vet
        if: ${{ inputs.vet }}
        working-directory: ${{ inputs.module }}
        run: go vet ./...

      # For monorepos whose modules replace each other by path:
      #
      #   replace github.com/<org>/<sibling> => ../<sibling>
      #
      # a dependency bump in the SIBLING changes this module's dependency graph, so its own
      # go.mod/go.sum stop satisfying it. Nothing in the bumping PR touches this module, and the
      # author has no reason to look here.
      #
      # Observed in core-provider#160: a dependabot PR bumping containerd in
      # composition-dynamic-controller failed three chart-inspector checks, with a diff confined to
      # cdc. It took three hypotheses to find -- "stale base" (disproved by rebasing) and "a
      # pre-existing problem the new vet job exposes" (disproved by the same job passing on another
      # PR off the same main) -- before the path replace explained a module failing while its files
      # matched main byte for byte.
      #
      # `go vet` already fails in that situation, but only with "go: updates to go.mod needed",
      # which names no module and reads like a toolchain complaint. This step says which module,
      # what to run, and why a PR that never touched it is red. Dependabot cannot produce the
      # companion commit itself: it bumps one module and cannot know a sibling replaces it by path.
      - name: go mod tidy is a no-op
        if: ${{ inputs.tidy_check }}
        working-directory: ${{ inputs.module }}
        run: |
          set -uo pipefail
          cp go.mod /tmp/go.mod.before
          [ -f go.sum ] && cp go.sum /tmp/go.sum.before || : > /tmp/go.sum.before
          if ! go mod tidy; then
            echo "::error::${{ inputs.module }}: 'go mod tidy' itself failed; the module cannot be resolved." >&2
            exit 1
          fi
          # Compare against the captured copies rather than `git diff`: this runs in a checkout that
          # other steps may have touched, and a guard that silently diffs the wrong thing is worse
          # than no guard.
          changed=0
          diff -u /tmp/go.mod.before go.mod > /tmp/go.mod.diff 2>&1 || changed=1
          if [ -f go.sum ]; then diff -u /tmp/go.sum.before go.sum > /tmp/go.sum.diff 2>&1 || changed=1; fi
          if [ "$changed" -ne 0 ]; then
            echo "::error::${{ inputs.module }}: go.mod/go.sum are not tidy. Run 'go mod tidy' in ${{ inputs.module }} and commit the result." >&2
            echo "::error::If this PR did not touch ${{ inputs.module }}, a SIBLING module it replaces by path was bumped -- see core-provider#160. The companion tidy belongs in this PR." >&2
            head -40 /tmp/go.mod.diff 2>/dev/null >&2 || true
            head -20 /tmp/go.sum.diff 2>/dev/null >&2 || true
            exit 1
          fi
          echo "go mod tidy: no change (${{ inputs.module }})"

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ inputs.module }}/go.mod
      - name: Gather dependencies
        working-directory: ${{ inputs.module }}
        run: go mod download
      - name: Run coverage
        working-directory: ${{ inputs.module }}
        run: go test ${{ inputs.test_args }}
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          working-directory: ${{ inputs.module }}

  crds-drift:
    name: CRDs drift guard
    if: ${{ inputs.crd_drift }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ inputs.module }}/go.mod
      - name: Regenerate CRDs
        working-directory: ${{ inputs.module }}
        run: make generate
      # Diff the WHOLE tree, not just <module>/crds/. Generated CRDs frequently have to exist in more
      # than one place -- the chart that versions and ships them, an envtest fixture -- and a guard
      # scoped to the generator's own output directory passes while those copies rot. The copy users
      # install is usually the one furthest from the generator, so it is the one most likely to be
      # missed and the most damaging when it is.
      #
      # Observed in oasgen-provider: `make generate` updated crds/ alone while the shipped CRD chart
      # kept a stale enum, with this guard green. Had it merged, the fix would have reached every file
      # except the one users install (krateo-platformops/oasgen-provider#84).
      #
      # This deliberately does not take a list of extra paths. A path list is itself a copy that falls
      # behind when a destination is added; diffing the tree covers whatever `make generate` writes, by
      # construction, in every repo that calls this.
      #
      # go.mod/go.sum are excluded because `make generate` runs `go mod tidy` in most repos, and that
      # churn is not CRD drift -- failing on it would be noise and would push repos to stop calling
      # this guard.
      - name: Fail on stale generated artifacts
        run: |
          if ! git diff --exit-code -- . ':(exclude)**/go.mod' ':(exclude)**/go.sum'; then
            echo "::error::Generated artifacts are stale. Run 'make generate' in ${{ inputs.module }} and commit the result, including any copies it syncs (chart templates, test fixtures)." >&2
            exit 1
          fi
          echo "Generated artifacts are up to date."
