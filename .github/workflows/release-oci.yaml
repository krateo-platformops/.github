# Reusable: THE canonical Krateo OCI package-build — the single way every krateo-* repo publishes Helm
# packages. Previously copied byte-for-byte into each repo; now called, so "identical across all repos"
# is enforced by construction instead of by discipline. A caller supplies only its triggers.
#
# It is fully shape-agnostic and discovers what to publish from the repo layout itself.
#
# What it publishes: every FIRST-CLASS chart in the repo — any directory containing a
# Chart.yaml that is NOT a vendored subchart (i.e. not sitting in some other chart's
# charts/ directory). That covers every layout in the org with one rule:
#   • single-chart repos:  chart/  crds-subchart/  target-chart/  kagent/chart/
#   • multi-chart repos:   charts/*            (each immediate child is first-class)
#   • vendored deps:       chart/charts/<dep>  (SKIPPED — grandparent is itself a chart)
#
# What it never publishes: a Chart.yaml under a directory named examples, example, __fixtures__,
# fixtures, testdata, test, tests, e2e, sample, samples, docs or node_modules. That list must contain every
# directory the repository standard (krateo-blueprints/charts repository-standard.yaml, FIXTURE) treats as a
# fixture, or a repository that passes the standard would have a fixture chart released here;
# .github/scripts/prune_agreement_test.py reads the standard at the charts commit this file pins and checks it. Those hold charts that exist to be READ — a
# test fixture, a documented example — and every one of them used to be packaged at the release
# version and pushed to the org registry. On frontend 1.6.57 a fixture named `builder-publish` (a real
# package owned by another repo) was refused with a 403, and the job died before pushing the repo's
# own charts: the tag shipped its image and none of its charts. chart-images.yaml discovers with the
# same prune list and the same vendored-subchart rule, so the image gate checks the charts this
# publishes. A repo can narrow discovery further with `chart_root` (e.g. `helm`); the root itself is
# never pruned, only what is below it.
#
# A failed push no longer stops the others. App charts are pushed first; a `<x>-crds` chart is pushed
# only if its `<x>` chart published in the same run (or the repo has no `<x>`), so a failure never
# leaves CRDs at a version whose app chart does not exist. The job then fails naming what failed and
# what was held back. Packaging still fails fast — nothing is pushed if any chart does not package.
#
# A published chart version is immutable. Before anything is pushed, every package is checked
# against the registry by the chart-version-guard action (.github/actions/chart-version-guard):
#   • not published                          → pushed.
#   • published with the same contents       → not pushed ("skipped"); the published artifact,
#                                              built by the commit that first released it, stays.
#   • published with DIFFERENT contents      → the job fails and nothing is pushed. Bump the version.
#   • the registry could not be asked        → the job fails and nothing is pushed. "Could not
#                                              check" is never read as "not published".
# The skip is a provenance guarantee, not tidiness. A published chart version's provenance (the
# commit that BUILT it, as stamped into its org.opencontainers.image.* annotations) is only true if
# that artifact is never re-pushed. Without the skip, every tag re-pushes every unchanged chart and
# re-stamps it with the tag's commit, which did not build that version, and installer's pin-ci
# would then vouch for the CI of the wrong commit. So provenance stamping must never run without
# this skip in front of the push.
#
# Contents means the files in the package, not the .tgz bytes: `helm package` writes fresh mtimes,
# so pushing an unchanged chart used to move its tag to a new digest on every release tag (seen on
# observability 3.1.31/3.1.32). Per-run provenance annotations and Chart.lock's `generated` time do
# not count either; guard.sh lists exactly what is ignored, checks that excluding them removes
# nothing else, and refuses a comparison that excluding them would leave empty. A chart repo's
# pull requests can run the same check through chart-version-guard.yaml.
#
# How versions are set (a chart opts in purely by which placeholders it authors):
#   • CHART_VERSION → the release tag (or workflow_dispatch input)
#   • SOURCE_REF    → the release tag           (federated agents pin their source to it)
#   • APP_VERSION   → latest semver tag of the application repo (the deployed image tag),
#                     auto-derived as <org>/<repo minus -chart suffix>; a no-op for charts
#                     that ship no image (no APP_VERSION placeholder) or whose app repo
#                     has no tags.
# A chart with none of these placeholders keeps its own literally-pinned versions untouched.
#
# What a package carries: the chart, and, when the chart has one, its CompositionDefinition at
# <name>/compositiondefinition.yaml, stamped with the version like Chart.yaml. "Has one" means a
# compositiondefinition.yaml in the chart directory (a builder repository, whose chart is the
# repository root) or in its parent (blueprints/<name>/ beside blueprints/<name>/chart/). The
# krateo-blueprints helm index takes the archive GHCR holds, and it refuses a blueprint whose archive
# does not register itself (krateo-blueprints/charts PUBLISHING.md, rules 1 and 3). Before anything
# is pushed, the package must hold exactly one CompositionDefinition, installing
# <oci_repo>/<name> at the package's version. A chart without a compositiondefinition.yaml in
# either place is packaged as it always was. The logic is the guard action's ship-cd.sh, which the
# pull-request check runs too.
#
# A version published before this existed has no compositiondefinition.yaml, so its re-release
# would read as "different contents". The release then checks the package without the file. If that
# is identical to what is published, the version is skipped and stays as published, without the
# file: published versions are immutable, and the next version carries one. Any other difference
# is refused as before.
#
# Collision guard: refuses to push unless OCI_REPO carries a chart-namespace path segment,
# so a chart named e.g. `frontend` can never collide with a same-named container image at
# the registry root. Universal, harmless for every repo. The default oci_repo is
# krateo-platformops'; a krateo-blueprints repository must pass oci://ghcr.io/krateo-blueprints/charts,
# and the target is compared as written: GitHub's redirect from an old org name still answers, so
# "it resolved" is not evidence that it is right.
#
# The repository's own preflight runs strictly before anything is pushed, by construction: the
# release-preflight job below (krateo-blueprints/charts PUBLISHING.md rule 12, which runs an executable
# hack/release-preflight <version> when the repository has one) is a `needs:` of the job that pushes.
# A caller no longer wires that order itself, so no caller can get it wrong (a release on 2026-11-07
# was left half-published because a caller pushed before its guard ran).
#
# What is stamped, and checked: CHART_VERSION in Chart.yaml (version, appVersion, anywhere) and in
# values.yaml (e.g. an image tag a chart ships at the release version), SOURCE_REF in Chart.yaml,
# and the CompositionDefinition (ship-cd.sh). A chart opts in purely by authoring a placeholder in
# those files. After packaging, the PACKAGE about to be pushed is read back: its Chart.yaml must be
# readable (the check's own control), no placeholder may survive in any member outside templates/
# (a template may carry it as text on purpose, as portal's builder templates do; a file nothing stamps
# carrying one is refused, not published literally), and a version or appVersion that authored the
# placeholder must carry the release version. helm semver-checks `version` but accepts any string as
# `appVersion` or a value, so without this an unstamped placeholder packaged, pushed and published
# with every step green. A version written literally is PUBLISHING.md rule 4's other shapes and is
# left as written; the repository's own guard owns its agreement.
#
# dry_run: everything runs (image gate, preflight, discovery, stamping, packaging, the
# CompositionDefinition check, the stamp check, the registry guard) and nothing is pushed. The
# registry login still happens, because dependency builds read through it; the push loop is never
# reached. Both modes upload the packages as the workflow artifact
# `release-oci-charts`, so a rehearsal proves what it built (a green run alone does not: a run that
# skipped its body looks the same). The input defaults to false so a tag push publishes as it always
# did; a caller makes its manual run safe by giving its own workflow_dispatch input `dry_run` a
# default of true and passing `dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}`.
#
# index_channel (REQUIRED, 2.0.0): blueprints, pages, operators, or none. A chart left out of the
# krateo-blueprints index must be a statement someone wrote (`none`), not an omitted input: an optional
# check silently protects nothing for a caller who forgets it, and that is how a chart ends up pushed but
# never indexed (github-provider-kog#111). For any channel but none, before anything is pushed:
#   • the index-preflight job refuses an absent `charts_publish_token` secret and one containing whitespace
#     anywhere (a trailing newline breaks the publisher after the push). It tests presence and shape only and
#     never prints or uses the value: a green check does NOT prove the token is valid or correctly scoped;
#   • every package passes the index's own content gate (krateo-blueprints/charts index-gate, the definition
#     publish-chart runs: right channel, complete archive, sources, plain version), so a chart the index
#     would refuse never reaches the registry.
# And after the push (not in a dry run), EVERY chart of the release is indexed here, so one call both
# pushes and indexes: the collect job pulls each back from GHCR at its version, so the index stores the
# registry's exact bytes (PUBLISHING.md rule 1; a repackage has fresh mtimes), and publish-index calls
# krateo-blueprints/charts publish-chart with them. A chart skipped as already published IS sent too: if an
# earlier run pushed it and then failed to index it, re-running the release is what finishes that half-done
# release, and the publisher is idempotent for the repository that owns a version (it re-stores the same
# bytes, and an already-indexed version changes nothing). It refuses only another repository's version.
#
# Migrating to 2.0.0 from a repository's own release (repository standard R5):
#   1. grep the repository for the old workflow's FILENAME first (e.g. release-tag.yaml): a script or a check
#      that reads it (a path, a pin read out of it) stops gating the moment it is deleted while every check
#      stays green. Retire or re-point each one on purpose, in the same change;
#   2. call this workflow with index_channel (and charts_publish_token: secrets.CHARTS_PUBLISH_TOKEN for any
#      channel but none) and oci_repo set explicitly (a krateo-blueprints repository:
#      oci://ghcr.io/krateo-blueprints/charts), and give the caller's workflow_dispatch a dry_run input
#      defaulting to true;
#   3. drop the repository's own release-preflight job, which this workflow now runs itself.
# From 1.x: add index_channel, the only breaking change.
#
# What this workflow deliberately does not do, and where it lives instead:
#   • Release notes, assets on the caller's GitHub release: a called workflow's permissions are capped
#     at its caller's and this one is `contents: read`, so they are TOP-LEVEL jobs of the caller
#     (krateo-platformops/.github release-notes.yaml is called that way), never nested here.
#   • A digest read-back after the push: chart-push's push.sh already reads every pushed manifest back
#     and requires the registry to serve the digest it uploaded. With the stamp check above, which
#     reads the package itself, the published chart is the checked one byte for byte.
name: release-oci

on:
  workflow_call:
    inputs:
      chart_version:
        description: "Chart version (CHART_VERSION/SOURCE_REF). Default: the git tag."
        type: string
        default: ""
      app_version:
        description: "App image version (APP_VERSION). Default: latest semver tag of the app repo."
        type: string
        default: ""
      oci_repo:
        description: "Target OCI repo. Must carry a chart-namespace path segment (see the collision guard)."
        type: string
        default: "oci://ghcr.io/krateo-platformops/charts"
      chart_root:
        description: "Directory to search for Chart.yaml files (e.g. `helm`). Default: the whole repo, minus examples/fixtures/test/docs directories."
        type: string
        default: "."
      dry_run:
        description: "Run every check and build every package, push nothing (see the header). Default false: a tag push publishes."
        type: boolean
        default: false
      index_channel:
        description: "The krateo-blueprints index channel these charts are published to: blueprints, pages, operators, or none (deliberately not indexed). Required (see the header)."
        type: string
        required: true
      preflight_working_directory:
        description: "Directory holding hack/release-preflight, relative to the repository root (PUBLISHING.md rule 12)."
        type: string
        default: "."

    secrets:
      charts_publish_token:
        description: "CHARTS_PUBLISH_TOKEN, required for any index_channel but none. Checked for presence and shape only, never used here."
        required: false

permissions:
  contents: read
  packages: write

jobs:
  # The index's preconditions, before anything is pushed (see the header): a known channel, and for any
  # channel but none, a token that is present and contains no whitespace. Presence and shape only.
  index-preflight:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Index channel and token
        env:
          INDEX_CHANNEL: ${{ inputs.index_channel }}
          CHARTS_PUBLISH_TOKEN: ${{ secrets.charts_publish_token }}
          OCI_REPO: ${{ inputs.oci_repo }}
        run: |
          # BEGIN index preflight (.github/scripts/release_oci_index_test.py runs it, and deletes it)
          set -euo pipefail
          case "${INDEX_CHANNEL}" in
            blueprints|pages|operators|none) ;;
            *) echo "::error::index_channel '${INDEX_CHANNEL}' is not blueprints, pages, operators or none. Nothing is pushed."; exit 1 ;;
          esac
          if [ "${INDEX_CHANNEL}" = none ]; then
            echo "index_channel none: these charts are deliberately not indexed; no token needed"
            exit 0
          fi
          # A blueprint or a page set is installed from the krateo-blueprints registry (its CompositionDefinition
          # names it), so it is pushed there: oci_repo's default is krateo-platformops', and taking it would
          # push into the wrong organisation. Compared as written (an old org name still resolves).
          case "${INDEX_CHANNEL}" in
            blueprints|pages)
              if [ "${OCI_REPO%/}" != "oci://ghcr.io/krateo-blueprints/charts" ]; then
                echo "::error::index_channel ${INDEX_CHANNEL} publishes to oci://ghcr.io/krateo-blueprints/charts, but oci_repo is '${OCI_REPO}' (its default is krateo-platformops'). Set oci_repo explicitly. Nothing is pushed."
                exit 1
              fi ;;
          esac
          if [ -z "${CHARTS_PUBLISH_TOKEN}" ]; then
            echo "::error::index_channel ${INDEX_CHANNEL} needs the charts_publish_token secret (CHARTS_PUBLISH_TOKEN), and none was passed. Without it the charts would be pushed and never indexed. Nothing is pushed."
            exit 1
          fi
          if [[ "${CHARTS_PUBLISH_TOKEN}" =~ [[:space:]] ]]; then
            echo "::error::charts_publish_token contains whitespace (a trailing newline breaks the publisher after the push). Re-set the secret without it. Nothing is pushed."
            exit 1
          fi
          echo "index_channel ${INDEX_CHANNEL}: a token is present and has no whitespace (presence and shape only, not validity)"
          # END index preflight

  # Gate: a chart referencing an image that does not exist publishes cleanly and then
  # ImagePullBackOffs on every install, several layers from the cause (oasgen-provider#62).
  # Nested rather than inlined so the check has ONE definition shared with the PR-time caller.
  verify-images:
    uses: krateo-platformops/.github/.github/workflows/chart-images.yaml@88eaff13555233606da5ff3ff3bfed8f534436ce # main 2026-11-18
    permissions:
      contents: read
      packages: read
    with:
      chart_version: ${{ inputs.chart_version }}
      app_version: ${{ inputs.app_version }}
      chart_root: ${{ inputs.chart_root }}

  # The repository's own preflight, strictly before anything is pushed (see the header).
  release-preflight:
    uses: krateo-blueprints/charts/.github/workflows/release-preflight.yaml@5825f8963e30193120c0460f6c6f31b596bf1ed8 # 1.13.2
    permissions:
      contents: read
    with:
      version: ${{ inputs.chart_version || github.ref_name }}
      working-directory: ${{ inputs.preflight_working_directory }}
      # A pre-release only for a chart that is never indexed: the index refuses one (PUBLISHING.md rule 13),
      # and the index gate below refuses it for any other channel before anything is pushed.
      allow-prerelease: ${{ inputs.index_channel == 'none' }}

  package-and-push:
    needs: [verify-images, release-preflight, index-preflight]
    outputs:
      # Every chart of this release, as a JSON array of {name, version}: pushed by this run, or already
      # published with identical contents (see the header).
      release_charts: ${{ steps.release.outputs.release_charts }}
    runs-on: ubuntu-latest
    # One check-and-push at a time per repository. Without it, two releases of one repo that overlap,
    # e.g. two tags pushed close together, or a tag and a workflow_dispatch, could both find a
    # version absent and both push it: the second would silently replace the first, with different
    # contents if their commits differ. Serialized, the second run's check sees the first's push.
    #
    # Scope: GitHub applies a group "in the repository" (workflow syntax, `concurrency`:
    # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#concurrency),
    # and in a called workflow "the github context is always associated with the caller workflow"
    # (https://docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations).
    # The caller's repository is in the name anyway, so the scope does not rest on that reading:
    # releases of different repos never wait for each other. The name must differ from any group a
    # caller sets itself, or GitHub cancels the running caller (same page); no caller uses it.
    #
    # Not cancel-in-progress: a running release is never interrupted. But GitHub keeps at most one
    # run pending per group, so a THIRD overlapping release cancels the pending second: that tag's
    # release-oci run shows as cancelled, published nothing, and must be re-run. Nothing is ever
    # published wrong.
    concurrency:
      group: release-oci-package-and-push-${{ github.repository }}
      cancel-in-progress: false
    env:
      OCI_REPO: ${{ inputs.oci_repo }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the tag-on-main guard needs history, not a shallow tip

      # A release tag must point at a commit contained in main. A tag cut from a side branch
      # publishes artefacts built from code that was never reviewed or merged, and it does so under a
      # version number that implies it was — the package is indistinguishable afterwards.
      #
      # Skipped for workflow_dispatch, which is the deliberate manual escape hatch.
      - name: Assert the tag is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          # Compare against FETCH_HEAD, not origin/main. The remote-tracking ref exists only if the
          # checkout configured a matching refspec; FETCH_HEAD is written by the fetch itself. Were
          # origin/main missing, merge-base would die with "unknown revision" and block EVERY release
          # rather than only the ones this guard exists to stop.
          git fetch --no-tags --quiet origin main
          if git merge-base --is-ancestor "${GITHUB_SHA}" FETCH_HEAD; then
            echo "OK: ${GITHUB_REF_NAME} (${GITHUB_SHA}) is contained in main"
          else
            echo "::error::tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is NOT contained in main."
            echo "::error::Release tags must be cut from main. Merge the branch first, then re-tag the merge commit."
            exit 1
          fi

      # Collision guard: require a chart-namespace path segment under host/org (e.g. .../krateo).
      # A bare registry root (oci://ghcr.io/<org>) would push a chart named <X> to
      # ghcr.io/<org>/<X> and collide with a same-named container image. Fail fast.
      - name: Assert chart-namespaced OCI_REPO (no registry-root push)
        run: |
          path="${OCI_REPO#oci://}"
          segs="$(printf '%s' "$path" | tr '/' '\n' | grep -c .)"
          if [ "$segs" -lt 3 ]; then
            echo "::error::OCI_REPO='${OCI_REPO}' is the registry root (${segs} path segments)."
            echo "::error::Use a chart-namespaced repo, e.g. oci://ghcr.io/krateo-platformops/charts."
            exit 1
          fi

      - name: Resolve versions
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          CHART_VERSION_INPUT: ${{ inputs.chart_version }}
          APP_VERSION_INPUT: ${{ inputs.app_version }}
        run: |
          set -euo pipefail
          CHART_VERSION="${CHART_VERSION_INPUT:-${GITHUB_REF_NAME}}"
          # The chart version, checked before anything is pushed. Rule 13's core (krateo-blueprints/charts
          # PUBLISHING.md: a plain X.Y.Z, no `v`, no leading zeros), plus an optional SemVer 2.0 pre-release, which
          # may go to GHCR and is never indexed; no +build. Each pre-release identifier is numeric without a leading
          # zero, or alphanumeric with at least one letter or hyphen (SemVer 2.0 section 9; helm's parser refuses
          # 1.2.3-01 too, but only after this point). Without it a version like 0.015.0 was pushed and then refused at
          # index time, pushed but never indexed (github-provider-kog#111). CORE is the three groups of charts'
          # PLAIN_VERSION byte for byte; .github/scripts/release_version_test.py fails if they differ.
          # BEGIN chart-version check (.github/scripts/release_version_test.py deletes or loosens it)
          CORE='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          PRE_ID='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          if ! [[ "${CHART_VERSION}" =~ ^${CORE}(-${PRE_ID}(\.${PRE_ID})*)?$ ]]; then
            echo "::error::chart version '${CHART_VERSION}' is not X.Y.Z with an optional SemVer pre-release (no v, no leading zeros, no +build). Nothing is pushed."
            exit 1
          fi
          # END chart-version check
          # App repo by convention: <org>/<this repo with any -chart suffix stripped>.
          APP_REPO="${GITHUB_REPOSITORY%-chart}"
          if [ -n "${APP_VERSION_INPUT}" ]; then
            APP_VERSION="${APP_VERSION_INPUT}"
          else
            APP_VERSION="$(gh api "repos/${APP_REPO}/tags" --paginate --jq '.[].name' 2>/dev/null \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
          fi
          echo "chart_version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "resolved: CHART_VERSION=${CHART_VERSION}  APP_VERSION=${APP_VERSION:-<none>}  (APP_REPO=${APP_REPO})"

      # The check that keeps a published version from being replaced (see the header). An action
      # rather than inline script, so this release and the PR-time chart-version-guard.yaml run the
      # same code.
      - name: Chart version guard
        id: guard
        uses: krateo-platformops/.github/.github/actions/chart-version-guard@88eaff13555233606da5ff3ff3bfed8f534436ce # main 2026-11-18

      - name: Helm setup
        uses: azure/setup-helm@v5.0.0
        with:
          version: v3.19.0

      # ubuntu-latest ships yq today, but "the runner has it" is the kind of assumption that turns
      # into a red release at the worst moment. This installs a known-good yq and REFUSES to continue
      # on anything else, because it sits under every chart publish in the org: a pinned version
      # number does not pin the bytes behind it, and a tampered or re-cut release would otherwise be
      # fetched and run with no complaint.
      #
      # The two digests below were confirmed twice before being written here: computed from the
      # downloaded bytes, AND matched against yq's own published `checksums` file for v4.44.3 (whose
      # SHA-256 column is located via its `checksums_hashes_order`, not guessed). A bogus hash was
      # checked against that table first, so "match" is a reading rather than a tautology.
      - name: Ensure yq (pinned, checksum-verified)
        run: |
          set -euo pipefail
          want=v4.44.3
          case "$(uname -m)" in
            x86_64)          arch=amd64; sha=a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7 ;;
            aarch64|arm64)   arch=arm64; sha=0e7e1524f68d91b3ff9b089872d185940ab0fa020a5a9052046ef10547023156 ;;
            *) echo "::error::unsupported runner architecture '$(uname -m)' — no verified yq digest for it"; exit 1 ;;
          esac

          if command -v yq >/dev/null 2>&1 && yq --version 2>/dev/null | grep -q "${want}"; then
            echo "yq ${want} already present: $(yq --version)"
            exit 0
          fi

          tmp="$(mktemp -d)"
          curl -fsSL -o "${tmp}/yq" \
            "https://github.com/mikefarah/yq/releases/download/${want}/yq_linux_${arch}"
          got="$(sha256sum "${tmp}/yq" | cut -d' ' -f1)"
          if [ "${got}" != "${sha}" ]; then
            echo "::error::yq ${want} ${arch} checksum mismatch — refusing to install"
            echo "::error::  expected ${sha}"
            echo "::error::  got      ${got}"
            exit 1
          fi
          sudo install -m 0755 "${tmp}/yq" /usr/local/bin/yq
          rm -rf "${tmp}"
          echo "yq verified and installed: $(yq --version)  (${arch}, sha256 ${sha})"

      # Also in a dry run: the login is what lets `helm dependency build` read a private OCI dependency,
      # so a rehearsal without it would package a different chart than the release. It pushes nothing.
      - name: Registry login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      # `helm push`, retrying only ghcr.io's "failed to perform Tag ... not found" after an accepted
      # upload: once the registry serves that digest, the same archive is pushed again and must land on
      # the same digest (see .github/actions/chart-push/push.sh). Locate mode: no inputs, so the step
      # below runs push.sh once per chart, with REGISTRY_USERNAME/REGISTRY_PASSWORD for its read-back.
      # Pinned by commit (krateo-blueprints/charts PUBLISHING.md rules 9 and 14): `@main` let any push to this
      # repository's main change how every caller's charts are pushed, with no commit in the caller. The comment is the
      # date of the pinned main commit, the transitional form until this repository tags its workflows
      # (krateo-blueprints/charts#23). A change to chart-push reaches release-oci by moving this pin.
      - name: Chart push
        id: push
        uses: krateo-platformops/.github/.github/actions/chart-push@88eaff13555233606da5ff3ff3bfed8f534436ce # main 2026-11-18

      # The index's own content gate (see the header), the definition publish-chart runs. Located here, run by
      # the step below after packaging and before anything is pushed, for any index_channel but none.
      - name: Index gate
        id: index-gate
        uses: krateo-blueprints/charts/.github/actions/index-gate@5825f8963e30193120c0460f6c6f31b596bf1ed8 # 1.13.2

      - name: Discover, version, package & push every first-class chart
        id: release
        env:
          CHART_VERSION_GUARD: ${{ steps.guard.outputs.path }}
          SHIP_CD: ${{ steps.guard.outputs.ship_cd }}
          CHART_PUSH: ${{ steps.push.outputs.path }}
          # The credentials the push uses: helm registry login ghcr.io with the run's GITHUB_TOKEN.
          REGISTRY_HOST: ghcr.io
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          CHART_VERSION: ${{ steps.ver.outputs.chart_version }}
          APP_VERSION: ${{ steps.ver.outputs.app_version }}
          CHART_ROOT: ${{ inputs.chart_root }}
          GIT_SHA: ${{ github.sha }}
          SRC_URL: ${{ github.server_url }}/${{ github.repository }}
          SRC_REF: ${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          INDEX_CHANNEL: ${{ inputs.index_channel }}
          INDEX_GATE: ${{ steps.index-gate.outputs.path }}
        run: |
          set -euo pipefail
          if [ ! -d "${CHART_ROOT:-.}" ]; then
            echo "::error::chart_root '${CHART_ROOT}' is not a directory"; exit 1
          fi

          # Discover first-class charts: a Chart.yaml is a vendored subchart (SKIP) iff its
          # parent dir is named `charts` AND its grandparent is itself a chart. Directories that
          # hold charts to be read, not released (examples, fixtures, test data, docs) are pruned
          # — keep this list identical to chart-images.yaml's. Everything else is published.
          charts=()
          while IFS= read -r cf; do
            d="$(dirname "$cf")"
            parent="$(dirname "$d")"
            if [ "$(basename "$parent")" = "charts" ] && [ -f "$(dirname "$parent")/Chart.yaml" ]; then
              continue
            fi
            charts+=("$d")
          done < <(find "${CHART_ROOT:-.}" -mindepth 1 \( -name .git -o -name node_modules -o -name examples -o -name example -o -name __fixtures__ -o -name fixtures -o -name testdata -o -name test -o -name tests -o -name e2e -o -name sample -o -name samples -o -name docs \) -prune -o -name Chart.yaml -print | sort)

          if [ "${#charts[@]}" -eq 0 ]; then
            echo "::error::no first-class charts found"; exit 1
          fi
          echo "First-class charts: ${charts[*]}"

          mkdir -p dist
          # Outside the checkout: a chart at the repository root would otherwise package this too.
          dist_without_cd="$(mktemp -d)"
          declare -A tgz_of=()
          declare -A without_cd_of=()
          for d in "${charts[@]}"; do
            echo "::group::package ${d}"
            # Which fields AUTHORED the placeholder, read before stamping: those must carry the release version
            # afterwards (the stamp check below). A field written literally is PUBLISHING.md rule 4's other
            # shapes (a chart versioned on its own, e.g. a served API version) and is left as written.
            ver_placeholder="$(yq -r '.version // ""' "${d}/Chart.yaml" | grep -c -E 'CHART_VERSION' || true)"
            app_placeholder="$(yq -r '.appVersion // ""' "${d}/Chart.yaml" | grep -c -E 'CHART_VERSION' || true)"
            # Opt-in placeholder substitution (untouched if a placeholder is absent). Global, never anchored
            # on a key: a substitution anchored to `version:` leaves appVersion as the literal placeholder.
            sed -i "s/CHART_VERSION/${CHART_VERSION}/g; s/SOURCE_REF/${CHART_VERSION}/g" "${d}/Chart.yaml"
            if [ -f "${d}/values.yaml" ]; then
              sed -i "s/CHART_VERSION/${CHART_VERSION}/g" "${d}/values.yaml"
            fi

            # Stamp PROVENANCE as OCI annotations, so a published chart says which commit built it
            # instead of leaving a consumer to reverse-engineer it. installer's check-pin-ci gate has
            # to answer "was this exact chart's CI green?", and until now it inferred the answer:
            # chart version -> appVersion -> a tag of a guessed repo -> that tag's check-runs. Every
            # link is a guess, and two of them broke in one evening.
            #   • krateo-observability 0.1.24 declares appVersion 3.2.0, which is the UPSTREAM
            #     ClickStack version it deploys, not a tag of ours and never will be. The chain has
            #     no valid link at all for any wrapper chart, so the pin was unverifiable.
            #   • github-provider-kog 0.7.0 lives in krateo-blueprints while the gate's token is
            #     minted per-org, so the lookup 403s. 26 of the installer's 68 pins are cross-org
            #     and share that blindness.
            # An annotation in the artefact needs no token, no repo guess and no appVersion
            # convention: it is read from the chart the consumer already pulled.
            #
            # Annotations rather than a comment because `helm package` preserves Chart.yaml's data
            # and discards nothing else it cannot see — a comment does not survive being read back
            # out of the .tgz. Merged with yq rather than appended with sed so a chart that already
            # authors `annotations:` keeps its own keys, and so re-running is idempotent.
            # THESE FOUR KEYS ARE A SHARED LIST. chart-version-guard compares a chart about to be
            # pushed against the published one, and must ignore anything that changes per run or every
            # re-release of an unchanged version would read as "different contents" and be refused. Its
            # `strip_provenance` removes exactly these four keys and `removable_chart` is the allowlist
            # of lines that removal may delete (.github/actions/chart-version-guard/guard.sh). Adding a
            # key here without adding it there turns every such release into a refusal, on every caller
            # at once, pointing at the guard rather than at this step. `created` is the trap: it is the
            # most standard OCI annotation of all and it is a timestamp, so it would differ on every run.
            yq -i '
              .annotations."org.opencontainers.image.revision" = strenv(GIT_SHA) |
              .annotations."org.opencontainers.image.source"   = strenv(SRC_URL) |
              .annotations."org.opencontainers.image.version"  = strenv(CHART_VERSION) |
              .annotations."org.opencontainers.image.ref.name" = strenv(SRC_REF)
            ' "${d}/Chart.yaml"
            if [ -n "${APP_VERSION}" ]; then
              sed -i "s/APP_VERSION/${APP_VERSION}/g" "${d}/Chart.yaml"
            fi
            if grep -q '^dependencies:' "${d}/Chart.yaml"; then
              # Still non-fatal (a chart with vendored deps packages without a build), but no longer
              # silent: a dependency that cannot be resolved is named here, not left for helm package
              # to report as something else.
              helm dependency build "${d}" >/dev/null 2>&1 || helm dependency update "${d}" >/dev/null 2>&1 \
                || echo "::warning::${d}: helm dependency build/update failed — packaging with what is vendored"
            fi

            # A chart with a CompositionDefinition ships it, stamped with this version (see "What a
            # package carries" in the header). It is packaged without it first, for the guard only: a
            # version published before this step existed has no compositiondefinition.yaml, and that
            # package is what tells "published before the file shipped" apart from "changed without a
            # bump". It is never pushed. A chart without one is packaged exactly as before.
            cd_src="$(bash "${SHIP_CD}" source "${d}")"
            if [ -n "${cd_src}" ]; then
              hidden=""
              if [ "${cd_src}" -ef "${d}/compositiondefinition.yaml" ]; then
                hidden="$(mktemp)"
                mv "${d}/compositiondefinition.yaml" "${hidden}"
              fi
              without="$(helm package "${d}" -d "${dist_without_cd}")"
              without_cd_of["${d}"]="${without##*: }"
              if [ -n "${hidden}" ]; then
                mv "${hidden}" "${d}/compositiondefinition.yaml"
              fi
              bash "${SHIP_CD}" prepare "${d}" "${CHART_VERSION}"
            fi
            out="$(helm package "${d}" -d dist/)"
            echo "${out}"
            tgz_of["${d}"]="${out##*: }"
            # The package, not the copy: helm package succeeds whether or not the file made it in.
            if [ -n "${cd_src}" ]; then
              bash "${SHIP_CD}" verify "${tgz_of[${d}]}" "${OCI_REPO}"
            fi

            # ASSERT THE STAMP SURVIVED. A step that silently does nothing is worse than no step:
            # every consumer would then read "no provenance" as "an old chart" forever, and the gate
            # downstream would keep falling back to inference while believing it had the real thing.
            # So read the annotation back out of the package actually about to be pushed, not out of
            # the working tree we just edited.
            # The directory INSIDE the .tgz is named after the chart's `name`, not after the
            # directory on disk -- `chart/` with `name: installer` packages as `installer/Chart.yaml`.
            # Using basename "${d}" here would have made this assertion fail on every repo in the org
            # whose chart lives in a generically-named directory, which is most of them.
            cname="$(yq -r '.name' "${d}/Chart.yaml")"
            stamped="$(tar -xzOf "${tgz_of[${d}]}" "${cname}/Chart.yaml" 2>/dev/null \
              | yq -r '.annotations."org.opencontainers.image.revision" // ""')"
            if [ "${stamped}" != "${GIT_SHA}" ]; then
              echo "::error::${d}: provenance annotation missing or wrong in $(basename "${tgz_of[${d}]}")"
              echo "::error::  expected revision ${GIT_SHA}, package carries '${stamped:-<none>}'"
              exit 1
            fi
            echo "provenance: $(basename "${tgz_of[${d}]}") -> ${stamped}"

            # BEGIN stamp check (.github/scripts/release_oci_stamp_test.py runs it, and deletes it)
            # Read out of the PACKAGE about to be pushed, never the working tree (see the header). Three checks,
            # each failing as "about to publish ...", never as a chart error:
            #  1. the package's Chart.yaml is readable at <name>/Chart.yaml: every helm package has one, so an
            #     empty read means the check below would pass by failing to look;
            #  2. no CHART_VERSION/SOURCE_REF survives in any member outside templates/ (where a template may
            #     carry the placeholder as text on purpose); a file nothing stamps (e.g. values.schema.json)
            #     carrying one is refused rather than published literally;
            #  3. a field that authored the placeholder (version, appVersion) carries the release version.
            pkg_chart="$(tar -xzOf "${tgz_of[${d}]}" "${cname}/Chart.yaml" 2>/dev/null || true)"
            if [ -z "${pkg_chart}" ]; then
              echo "::error::${d}: about to publish without checking it: cannot read ${cname}/Chart.yaml out of $(basename "${tgz_of[${d}]}"), so the stamp check would pass by failing to look. Nothing is pushed."
              exit 1
            fi
            survivors=""
            while IFS= read -r member; do
              case "${member}" in "${cname}/templates/"*|*/) continue ;; esac
              if tar -xzOf "${tgz_of[${d}]}" "${member}" 2>/dev/null | grep -q -E 'CHART_VERSION|SOURCE_REF'; then
                survivors="${survivors} ${member#"${cname}/"}"
              fi
            done < <(tar -tzf "${tgz_of[${d}]}")
            if [ -n "${survivors}" ]; then
              echo "::error::${d}: about to publish an unstamped placeholder: CHART_VERSION or SOURCE_REF survives in${survivors} of $(basename "${tgz_of[${d}]}"). Only Chart.yaml, values.yaml and the CompositionDefinition are stamped. Nothing is pushed."
              exit 1
            fi
            pkg_ver="$(yq -r '.version // ""' <<< "${pkg_chart}")"
            pkg_app="$(yq -r '.appVersion // ""' <<< "${pkg_chart}")"
            if [ "${ver_placeholder:-0}" != 0 ] && [ "${pkg_ver}" != "${CHART_VERSION}" ]; then
              echo "::error::${d}: about to publish the wrong version: version authored the placeholder but the package carries '${pkg_ver}', not the release version '${CHART_VERSION}'. Nothing is pushed."
              exit 1
            fi
            if [ "${app_placeholder:-0}" != 0 ] && [ "${pkg_app}" != "${CHART_VERSION}" ]; then
              echo "::error::${d}: about to publish the wrong version: appVersion authored the placeholder but the package carries '${pkg_app}', not the release version '${CHART_VERSION}'. Nothing is pushed."
              exit 1
            fi
            # END stamp check
            echo "::endgroup::"
          done

          # BEGIN index gate call (.github/scripts/release_oci_index_test.py checks its place and guard)
          # The index's own rules, on every package, before anything is pushed (see the header). The input is
          # required, so the default below is never reached in a release; it exists for the step's self-tests.
          if [ "${INDEX_CHANNEL:-none}" != none ]; then
            echo "::group::index gate (${INDEX_CHANNEL})"
            if ! CHANNEL="${INDEX_CHANNEL}" SRC="${GITHUB_REPOSITORY}" bash "${INDEX_GATE}" dist; then
              echo "::error::the index would refuse these charts in ${INDEX_CHANNEL} (above). Nothing is pushed."
              exit 1
            fi
            echo "::endgroup::"
          fi
          # END index gate call

          # Ask the registry about every package before pushing any (see the header). A refusal or a
          # failed check stops the whole release, as a packaging failure does: a release that would
          # rewrite a published version, or that could not find out, is not one to half-publish.
          #
          # The skip (exit 10) is what keeps provenance true: the published artifact, stamped by the
          # commit that built this version, stays. Pushing this run's package instead would re-stamp
          # an unchanged version with a commit that did not build it.
          declare -A skip_of=()
          refused=()
          for d in "${charts[@]}"; do
            tgz="${tgz_of[${d}]}"
            echo "::group::guard $(basename "${tgz}")"
            rc=0
            before_cd=""
            if [ -z "${without_cd_of[${d}]:-}" ]; then
              bash "${CHART_VERSION_GUARD}" "${tgz}" "${OCI_REPO}" || rc=$?
            else
              # A version published before CompositionDefinitions shipped differs from this package by
              # exactly that file. If the package without it is identical to what is published, the
              # version is unchanged: skip it, and the published artifact stays, without the file,
              # because a published version is immutable. Anything else is the guard's verdict on
              # the package that would be pushed. Its output is held back until then, so a skip
              # does not also print the guard's "different" error.
              verdict="$(bash "${CHART_VERSION_GUARD}" "${tgz}" "${OCI_REPO}" 2>&1)" || rc=$?
              if [ "${rc}" = 11 ]; then
                rc_without=0
                verdict_without="$(bash "${CHART_VERSION_GUARD}" "${without_cd_of[${d}]}" "${OCI_REPO}" 2>&1)" || rc_without=$?
                if [ "${rc_without}" = 10 ]; then
                  rc=10
                  before_cd=yes
                  verdict="${verdict_without}"
                fi
              fi
              printf '%s\n' "${verdict}"
            fi
            case "${rc}" in
              0)  ;;
              10) skip_of["${d}"]=1
                  if [ -n "${before_cd}" ]; then
                    echo "::notice::skipped: $(basename "${tgz}") was published before release-oci shipped CompositionDefinitions. It is identical to this package without compositiondefinition.yaml, so the published artifact stays, without one. The next version carries it."
                  else
                    echo "skipped: $(basename "${tgz}") is already published, contents identical; the published artifact stays"
                  fi ;;
              11) refused+=("$(basename "${tgz}") (published with different contents)") ;;
              *)  refused+=("$(basename "${tgz}") (could not check the registry)") ;;
            esac
            echo "::endgroup::"
          done
          if [ "${#refused[@]}" -gt 0 ]; then
            echo "::error::pushed nothing. Refused: ${refused[*]}"
            exit 1
          fi

          # A dry run stops here: every check has run, nothing is pushed.
          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "::notice::dry run: nothing pushed. Would push: $(for d in "${charts[@]}"; do [ -z "${skip_of[${d}]:-}" ] && printf '%s ' "$(basename "${tgz_of[${d}]}")"; done)| already published, identical: ${#skip_of[@]}"
            exit 0
          fi

          # Push every chart, app charts first, and fail at the end naming what did not publish. Stopping
          # at the first failure (alphabetical order) let one refused chart leave the rest unpublished;
          # pushing blindly would instead let `<x>-crds` publish at a version whose `<x>` never did.
          declare -A ok_of=()
          failed=(); held=()
          push_chart() {
            local d="$1" tgz="${tgz_of[$1]}"
            # Already published with these contents: it counts as published at this version.
            if [ -n "${skip_of[${d}]:-}" ]; then ok_of["${d}"]=1; return; fi
            echo "Pushing ${tgz} -> ${OCI_REPO}"
            if bash "${CHART_PUSH}" "${tgz}" "${OCI_REPO}"; then
              ok_of["${d}"]=1
            else
              echo "::error::push failed: ${tgz}"
              failed+=("$(basename "${tgz}")")
            fi
          }
          for d in "${charts[@]}"; do
            case "${d}" in *-crds) ;; *) push_chart "${d}" ;; esac
          done
          for d in "${charts[@]}"; do
            case "${d}" in *-crds) ;; *) continue ;; esac
            app="${d%-crds}"
            if [ -n "${tgz_of[${app}]:-}" ] && [ -z "${ok_of[${app}]:-}" ]; then
              echo "::error::holding back $(basename "${tgz_of[${d}]}"): ${app} did not publish at this version"
              held+=("$(basename "${tgz_of[${d}]}")")
              continue
            fi
            push_chart "${d}"
          done
          if [ "${#failed[@]}" -gt 0 ] || [ "${#held[@]}" -gt 0 ]; then
            echo "::error::published ${#ok_of[@]} of ${#charts[@]} chart(s); failed: ${failed[*]:-none}; held back: ${held[*]:-none}"
            exit 1
          fi
          echo "done: pushed $(( ${#ok_of[@]} - ${#skip_of[@]} )), skipped ${#skip_of[@]} already published with identical contents, of ${#charts[@]} chart(s)"

          # BEGIN release charts output (.github/scripts/release_oci_index_test.py runs it)
          # What publish-index indexes: every chart of this release that is published at its version, pushed by
          # this run or already published with identical contents, each with the name and version its package
          # carries. A chart that failed to push is not (the run fails anyway). See the header.
          release_charts='[]'
          for d in "${charts[@]}"; do
            if [ -n "${ok_of[${d}]:-}" ]; then
              meta="$(tar -xzOf "${tgz_of[${d}]}" "$(yq -r '.name' "${d}/Chart.yaml")/Chart.yaml")"
              release_charts="$(jq -c --arg n "$(yq -r '.name' <<< "${meta}")" --arg v "$(yq -r '.version' <<< "${meta}")" '. + [{name: $n, version: $v}]' <<< "${release_charts}")"
            fi
          done
          echo "release_charts=${release_charts}" >> "${GITHUB_OUTPUT:-/dev/null}"
          echo "to index: ${release_charts}"
          # END release charts output

      # The packages this run built, in both modes: a rehearsal's proof of what it would have pushed,
      # and a release's record of what it did (see the header).
      - name: Upload the packages
        if: ${{ always() && hashFiles('dist/*.tgz') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-oci-charts
          path: dist/*.tgz
          if-no-files-found: error

  # Pull back from GHCR exactly the release's charts (pushed by this run or already published), so the index stores
  # the registry's bytes (see the header).
  collect:
    needs: [package-and-push]
    if: ${{ inputs.index_channel != 'none' && !inputs.dry_run && needs.package-and-push.outputs.release_charts != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      OCI_REPO: ${{ inputs.oci_repo }}
      RELEASE_CHARTS: ${{ needs.package-and-push.outputs.release_charts }}
    steps:
      - name: Helm setup
        uses: azure/setup-helm@v5.0.0
        with:
          version: v3.19.0
      - name: Registry login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Pull every chart of the release back, and assert the set
        run: |
          set -euo pipefail
          mkdir -p index-dist
          want=()
          while IFS=$'\t' read -r name version; do
            helm pull "${OCI_REPO}/${name}" --version "${version}" -d index-dist
            want+=("${name}-${version}.tgz")
          done < <(jq -r '.[] | [.name, .version] | @tsv' <<< "${RELEASE_CHARTS}")
          got="$(find index-dist -maxdepth 1 -type f -name '*.tgz' -exec basename {} \; | sort | tr '\n' ' ')"
          exp="$(printf '%s\n' "${want[@]}" | sort | tr '\n' ' ')"
          if [ "${got}" != "${exp}" ]; then
            echo "::error::pulled back '${got}', expected exactly '${exp}'"; exit 1
          fi
          echo "to index: ${got}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-oci-index
          path: index-dist/*.tgz
          if-no-files-found: error

  # The org's one index publisher, pinned by commit (PUBLISHING.md rule 9): it receives the publish token.
  publish-index:
    needs: [collect]
    uses: krateo-blueprints/charts/.github/workflows/publish-chart.yaml@5825f8963e30193120c0460f6c6f31b596bf1ed8 # 1.13.2
    with:
      source_repo: ${{ github.repository }}
      git_tag: ${{ inputs.chart_version || github.ref_name }}
      channel: ${{ inputs.index_channel }}
      artifact: release-oci-index
    secrets:
      PUBLISH_TOKEN: ${{ secrets.charts_publish_token }}
