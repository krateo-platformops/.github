# Reusable: THE canonical Krateo OCI package-build — the single way every krateo-* repo publishes Helm
# packages. Previously copied byte-for-byte into each repo; now called, so "identical across all repos"
# is enforced by construction instead of by discipline. A caller supplies only its triggers.
#
# It is fully shape-agnostic and discovers what to publish from the repo layout itself.
#
# What it publishes: every FIRST-CLASS chart in the repo — any directory containing a
# Chart.yaml that is NOT a vendored subchart (i.e. not sitting in some other chart's
# charts/ directory). That covers every layout in the org with one rule:
#   • single-chart repos:  chart/  crds-subchart/  target-chart/  kagent/chart/
#   • multi-chart repos:   charts/*            (each immediate child is first-class)
#   • vendored deps:       chart/charts/<dep>  (SKIPPED — grandparent is itself a chart)
#
# What it never publishes: a Chart.yaml under a directory named examples, example, __fixtures__,
# fixtures, testdata, test, tests, docs or node_modules. Those hold charts that exist to be READ — a
# test fixture, a documented example — and every one of them used to be packaged at the release
# version and pushed to the org registry. On frontend 1.6.57 a fixture named `builder-publish` (a real
# package owned by another repo) was refused with a 403, and the job died before pushing the repo's
# own charts: the tag shipped its image and none of its charts. chart-images.yaml discovers with the
# same prune list and the same vendored-subchart rule, so the image gate checks the charts this
# publishes. A repo can narrow discovery further with `chart_root` (e.g. `helm`); the root itself is
# never pruned, only what is below it.
#
# A failed push no longer stops the others. App charts are pushed first; a `<x>-crds` chart is pushed
# only if its `<x>` chart published in the same run (or the repo has no `<x>`), so a failure never
# leaves CRDs at a version whose app chart does not exist. The job then fails naming what failed and
# what was held back. Packaging still fails fast — nothing is pushed if any chart does not package.
#
# A published chart version is immutable. Before anything is pushed, every package is checked
# against the registry by the chart-version-guard action (.github/actions/chart-version-guard):
#   • not published                          → pushed.
#   • published with the same contents       → not pushed ("skipped"); the published artifact,
#                                              built by the commit that first released it, stays.
#   • published with DIFFERENT contents      → the job fails and nothing is pushed. Bump the version.
#   • the registry could not be asked        → the job fails and nothing is pushed. "Could not
#                                              check" is never read as "not published".
# The skip is a provenance guarantee, not tidiness. A published chart version's provenance (the
# commit that BUILT it, as stamped into its org.opencontainers.image.* annotations) is only true if
# that artifact is never re-pushed. Without the skip, every tag re-pushes every unchanged chart and
# re-stamps it with the tag's commit, which did not build that version, and installer's pin-ci
# would then vouch for the CI of the wrong commit. So provenance stamping must never run without
# this skip in front of the push.
#
# Contents means the files in the package, not the .tgz bytes: `helm package` writes fresh mtimes,
# so pushing an unchanged chart used to move its tag to a new digest on every release tag (seen on
# observability 3.1.31/3.1.32). Per-run provenance annotations and Chart.lock's `generated` time do
# not count either; guard.sh lists exactly what is ignored, checks that excluding them removes
# nothing else, and refuses a comparison that excluding them would leave empty. A chart repo's
# pull requests can run the same check through chart-version-guard.yaml.
#
# How versions are set (a chart opts in purely by which placeholders it authors):
#   • CHART_VERSION → the release tag (or workflow_dispatch input)
#   • SOURCE_REF    → the release tag           (federated agents pin their source to it)
#   • APP_VERSION   → latest semver tag of the application repo (the deployed image tag),
#                     auto-derived as <org>/<repo minus -chart suffix>; a no-op for charts
#                     that ship no image (no APP_VERSION placeholder) or whose app repo
#                     has no tags.
# A chart with none of these placeholders keeps its own literally-pinned versions untouched.
#
# Collision guard: refuses to push unless OCI_REPO carries a chart-namespace path segment,
# so a chart named e.g. `frontend` can never collide with a same-named container image at
# the registry root. Universal, harmless for every repo.
name: release-oci

on:
  workflow_call:
    inputs:
      chart_version:
        description: "Chart version (CHART_VERSION/SOURCE_REF). Default: the git tag."
        type: string
        default: ""
      app_version:
        description: "App image version (APP_VERSION). Default: latest semver tag of the app repo."
        type: string
        default: ""
      oci_repo:
        description: "Target OCI repo. Must carry a chart-namespace path segment (see the collision guard)."
        type: string
        default: "oci://ghcr.io/krateo-platformops/charts"
      chart_root:
        description: "Directory to search for Chart.yaml files (e.g. `helm`). Default: the whole repo, minus examples/fixtures/test/docs directories."
        type: string
        default: "."

permissions:
  contents: read
  packages: write

jobs:
  # Gate: a chart referencing an image that does not exist publishes cleanly and then
  # ImagePullBackOffs on every install, several layers from the cause (oasgen-provider#62).
  # Nested rather than inlined so the check has ONE definition shared with the PR-time caller.
  verify-images:
    uses: krateo-platformops/.github/.github/workflows/chart-images.yaml@main
    permissions:
      contents: read
      packages: read
    with:
      chart_version: ${{ inputs.chart_version }}
      app_version: ${{ inputs.app_version }}
      chart_root: ${{ inputs.chart_root }}

  package-and-push:
    needs: [verify-images]
    runs-on: ubuntu-latest
    # One check-and-push at a time per repository. Without it, two releases of one repo that overlap,
    # e.g. two tags pushed close together, or a tag and a workflow_dispatch, could both find a
    # version absent and both push it: the second would silently replace the first, with different
    # contents if their commits differ. Serialized, the second run's check sees the first's push.
    #
    # Scope: GitHub applies a group "in the repository" (workflow syntax, `concurrency`:
    # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#concurrency),
    # and in a called workflow "the github context is always associated with the caller workflow"
    # (https://docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations).
    # The caller's repository is in the name anyway, so the scope does not rest on that reading:
    # releases of different repos never wait for each other. The name must differ from any group a
    # caller sets itself, or GitHub cancels the running caller (same page); no caller uses it.
    #
    # Not cancel-in-progress: a running release is never interrupted. But GitHub keeps at most one
    # run pending per group, so a THIRD overlapping release cancels the pending second: that tag's
    # release-oci run shows as cancelled, published nothing, and must be re-run. Nothing is ever
    # published wrong.
    concurrency:
      group: release-oci-package-and-push-${{ github.repository }}
      cancel-in-progress: false
    env:
      OCI_REPO: ${{ inputs.oci_repo }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the tag-on-main guard needs history, not a shallow tip

      # A release tag must point at a commit contained in main. A tag cut from a side branch
      # publishes artefacts built from code that was never reviewed or merged, and it does so under a
      # version number that implies it was — the package is indistinguishable afterwards.
      #
      # Skipped for workflow_dispatch, which is the deliberate manual escape hatch.
      - name: Assert the tag is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          # Compare against FETCH_HEAD, not origin/main. The remote-tracking ref exists only if the
          # checkout configured a matching refspec; FETCH_HEAD is written by the fetch itself. Were
          # origin/main missing, merge-base would die with "unknown revision" and block EVERY release
          # rather than only the ones this guard exists to stop.
          git fetch --no-tags --quiet origin main
          if git merge-base --is-ancestor "${GITHUB_SHA}" FETCH_HEAD; then
            echo "OK: ${GITHUB_REF_NAME} (${GITHUB_SHA}) is contained in main"
          else
            echo "::error::tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is NOT contained in main."
            echo "::error::Release tags must be cut from main. Merge the branch first, then re-tag the merge commit."
            exit 1
          fi

      # Collision guard: require a chart-namespace path segment under host/org (e.g. .../krateo).
      # A bare registry root (oci://ghcr.io/<org>) would push a chart named <X> to
      # ghcr.io/<org>/<X> and collide with a same-named container image. Fail fast.
      - name: Assert chart-namespaced OCI_REPO (no registry-root push)
        run: |
          path="${OCI_REPO#oci://}"
          segs="$(printf '%s' "$path" | tr '/' '\n' | grep -c .)"
          if [ "$segs" -lt 3 ]; then
            echo "::error::OCI_REPO='${OCI_REPO}' is the registry root (${segs} path segments)."
            echo "::error::Use a chart-namespaced repo, e.g. oci://ghcr.io/krateo-platformops/charts."
            exit 1
          fi

      - name: Resolve versions
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          CHART_VERSION_INPUT: ${{ inputs.chart_version }}
          APP_VERSION_INPUT: ${{ inputs.app_version }}
        run: |
          set -euo pipefail
          CHART_VERSION="${CHART_VERSION_INPUT:-${GITHUB_REF_NAME}}"
          # App repo by convention: <org>/<this repo with any -chart suffix stripped>.
          APP_REPO="${GITHUB_REPOSITORY%-chart}"
          if [ -n "${APP_VERSION_INPUT}" ]; then
            APP_VERSION="${APP_VERSION_INPUT}"
          else
            APP_VERSION="$(gh api "repos/${APP_REPO}/tags" --paginate --jq '.[].name' 2>/dev/null \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
          fi
          echo "chart_version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "resolved: CHART_VERSION=${CHART_VERSION}  APP_VERSION=${APP_VERSION:-<none>}  (APP_REPO=${APP_REPO})"

      # The check that keeps a published version from being replaced (see the header). An action
      # rather than inline script, so this release and the PR-time chart-version-guard.yaml run the
      # same code.
      - name: Chart version guard
        id: guard
        uses: krateo-platformops/.github/.github/actions/chart-version-guard@main

      - name: Helm setup
        uses: azure/setup-helm@v5.0.0
        with:
          version: v3.19.0

      # ubuntu-latest ships yq today, but "the runner has it" is the kind of assumption that turns
      # into a red release at the worst moment. This installs a known-good yq and REFUSES to continue
      # on anything else, because it sits under every chart publish in the org: a pinned version
      # number does not pin the bytes behind it, and a tampered or re-cut release would otherwise be
      # fetched and run with no complaint.
      #
      # The two digests below were confirmed twice before being written here: computed from the
      # downloaded bytes, AND matched against yq's own published `checksums` file for v4.44.3 (whose
      # SHA-256 column is located via its `checksums_hashes_order`, not guessed). A bogus hash was
      # checked against that table first, so "match" is a reading rather than a tautology.
      - name: Ensure yq (pinned, checksum-verified)
        run: |
          set -euo pipefail
          want=v4.44.3
          case "$(uname -m)" in
            x86_64)          arch=amd64; sha=a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7 ;;
            aarch64|arm64)   arch=arm64; sha=0e7e1524f68d91b3ff9b089872d185940ab0fa020a5a9052046ef10547023156 ;;
            *) echo "::error::unsupported runner architecture '$(uname -m)' — no verified yq digest for it"; exit 1 ;;
          esac

          if command -v yq >/dev/null 2>&1 && yq --version 2>/dev/null | grep -q "${want}"; then
            echo "yq ${want} already present: $(yq --version)"
            exit 0
          fi

          tmp="$(mktemp -d)"
          curl -fsSL -o "${tmp}/yq" \
            "https://github.com/mikefarah/yq/releases/download/${want}/yq_linux_${arch}"
          got="$(sha256sum "${tmp}/yq" | cut -d' ' -f1)"
          if [ "${got}" != "${sha}" ]; then
            echo "::error::yq ${want} ${arch} checksum mismatch — refusing to install"
            echo "::error::  expected ${sha}"
            echo "::error::  got      ${got}"
            exit 1
          fi
          sudo install -m 0755 "${tmp}/yq" /usr/local/bin/yq
          rm -rf "${tmp}"
          echo "yq verified and installed: $(yq --version)  (${arch}, sha256 ${sha})"

      - name: Registry login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      # `helm push` with a bounded retry of ghcr.io's transient "failed to perform Tag ... not found"
      # after an accepted upload, and of nothing else (see .github/actions/chart-push/push.sh).
      - name: Chart push
        id: push
        uses: krateo-platformops/.github/.github/actions/chart-push@main

      - name: Discover, version, package & push every first-class chart
        env:
          CHART_VERSION_GUARD: ${{ steps.guard.outputs.path }}
          CHART_PUSH: ${{ steps.push.outputs.path }}
          # The credentials the push uses: helm registry login ghcr.io with the run's GITHUB_TOKEN.
          REGISTRY_HOST: ghcr.io
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          CHART_VERSION: ${{ steps.ver.outputs.chart_version }}
          APP_VERSION: ${{ steps.ver.outputs.app_version }}
          CHART_ROOT: ${{ inputs.chart_root }}
          GIT_SHA: ${{ github.sha }}
          SRC_URL: ${{ github.server_url }}/${{ github.repository }}
          SRC_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ ! -d "${CHART_ROOT:-.}" ]; then
            echo "::error::chart_root '${CHART_ROOT}' is not a directory"; exit 1
          fi

          # Discover first-class charts: a Chart.yaml is a vendored subchart (SKIP) iff its
          # parent dir is named `charts` AND its grandparent is itself a chart. Directories that
          # hold charts to be read, not released (examples, fixtures, test data, docs) are pruned
          # — keep this list identical to chart-images.yaml's. Everything else is published.
          charts=()
          while IFS= read -r cf; do
            d="$(dirname "$cf")"
            parent="$(dirname "$d")"
            if [ "$(basename "$parent")" = "charts" ] && [ -f "$(dirname "$parent")/Chart.yaml" ]; then
              continue
            fi
            charts+=("$d")
          done < <(find "${CHART_ROOT:-.}" -mindepth 1 \( -name .git -o -name node_modules -o -name examples -o -name example -o -name __fixtures__ -o -name fixtures -o -name testdata -o -name test -o -name tests -o -name docs \) -prune -o -name Chart.yaml -print | sort)

          if [ "${#charts[@]}" -eq 0 ]; then
            echo "::error::no first-class charts found"; exit 1
          fi
          echo "First-class charts: ${charts[*]}"

          mkdir -p dist
          declare -A tgz_of=()
          for d in "${charts[@]}"; do
            echo "::group::package ${d}"
            # Opt-in placeholder substitution (untouched if a placeholder is absent).
            sed -i "s/CHART_VERSION/${CHART_VERSION}/g; s/SOURCE_REF/${CHART_VERSION}/g" "${d}/Chart.yaml"

            # Stamp PROVENANCE as OCI annotations, so a published chart says which commit built it
            # instead of leaving a consumer to reverse-engineer it. installer's check-pin-ci gate has
            # to answer "was this exact chart's CI green?", and until now it inferred the answer:
            # chart version -> appVersion -> a tag of a guessed repo -> that tag's check-runs. Every
            # link is a guess, and two of them broke in one evening.
            #   • krateo-observability 0.1.24 declares appVersion 3.2.0, which is the UPSTREAM
            #     ClickStack version it deploys, not a tag of ours and never will be. The chain has
            #     no valid link at all for any wrapper chart, so the pin was unverifiable.
            #   • github-provider-kog 0.7.0 lives in krateo-blueprints while the gate's token is
            #     minted per-org, so the lookup 403s. 26 of the installer's 68 pins are cross-org
            #     and share that blindness.
            # An annotation in the artefact needs no token, no repo guess and no appVersion
            # convention: it is read from the chart the consumer already pulled.
            #
            # Annotations rather than a comment because `helm package` preserves Chart.yaml's data
            # and discards nothing else it cannot see — a comment does not survive being read back
            # out of the .tgz. Merged with yq rather than appended with sed so a chart that already
            # authors `annotations:` keeps its own keys, and so re-running is idempotent.
            # THESE FOUR KEYS ARE A SHARED LIST. chart-version-guard compares a chart about to be
            # pushed against the published one, and must ignore anything that changes per run or every
            # re-release of an unchanged version would read as "different contents" and be refused. Its
            # `strip_provenance` removes exactly these four keys and `removable_chart` is the allowlist
            # of lines that removal may delete (.github/actions/chart-version-guard/guard.sh). Adding a
            # key here without adding it there turns every such release into a refusal, on every caller
            # at once, pointing at the guard rather than at this step. `created` is the trap: it is the
            # most standard OCI annotation of all and it is a timestamp, so it would differ on every run.
            yq -i '
              .annotations."org.opencontainers.image.revision" = strenv(GIT_SHA) |
              .annotations."org.opencontainers.image.source"   = strenv(SRC_URL) |
              .annotations."org.opencontainers.image.version"  = strenv(CHART_VERSION) |
              .annotations."org.opencontainers.image.ref.name" = strenv(SRC_REF)
            ' "${d}/Chart.yaml"
            if [ -n "${APP_VERSION}" ]; then
              sed -i "s/APP_VERSION/${APP_VERSION}/g" "${d}/Chart.yaml"
            fi
            if grep -q '^dependencies:' "${d}/Chart.yaml"; then
              # Still non-fatal (a chart with vendored deps packages without a build), but no longer
              # silent: a dependency that cannot be resolved is named here, not left for helm package
              # to report as something else.
              helm dependency build "${d}" >/dev/null 2>&1 || helm dependency update "${d}" >/dev/null 2>&1 \
                || echo "::warning::${d}: helm dependency build/update failed — packaging with what is vendored"
            fi
            out="$(helm package "${d}" -d dist/)"
            echo "${out}"
            tgz_of["${d}"]="${out##*: }"

            # ASSERT THE STAMP SURVIVED. A step that silently does nothing is worse than no step:
            # every consumer would then read "no provenance" as "an old chart" forever, and the gate
            # downstream would keep falling back to inference while believing it had the real thing.
            # So read the annotation back out of the package actually about to be pushed, not out of
            # the working tree we just edited.
            # The directory INSIDE the .tgz is named after the chart's `name`, not after the
            # directory on disk -- `chart/` with `name: installer` packages as `installer/Chart.yaml`.
            # Using basename "${d}" here would have made this assertion fail on every repo in the org
            # whose chart lives in a generically-named directory, which is most of them.
            cname="$(yq -r '.name' "${d}/Chart.yaml")"
            stamped="$(tar -xzOf "${tgz_of[${d}]}" "${cname}/Chart.yaml" 2>/dev/null \
              | yq -r '.annotations."org.opencontainers.image.revision" // ""')"
            if [ "${stamped}" != "${GIT_SHA}" ]; then
              echo "::error::${d}: provenance annotation missing or wrong in $(basename "${tgz_of[${d}]}")"
              echo "::error::  expected revision ${GIT_SHA}, package carries '${stamped:-<none>}'"
              exit 1
            fi
            echo "provenance: $(basename "${tgz_of[${d}]}") -> ${stamped}"
            echo "::endgroup::"
          done

          # Ask the registry about every package before pushing any (see the header). A refusal or a
          # failed check stops the whole release, as a packaging failure does: a release that would
          # rewrite a published version, or that could not find out, is not one to half-publish.
          #
          # The skip (exit 10) is what keeps provenance true: the published artifact, stamped by the
          # commit that built this version, stays. Pushing this run's package instead would re-stamp
          # an unchanged version with a commit that did not build it.
          declare -A skip_of=()
          refused=()
          for d in "${charts[@]}"; do
            tgz="${tgz_of[${d}]}"
            echo "::group::guard $(basename "${tgz}")"
            rc=0
            bash "${CHART_VERSION_GUARD}" "${tgz}" "${OCI_REPO}" || rc=$?
            case "${rc}" in
              0)  ;;
              10) skip_of["${d}"]=1
                  echo "skipped: $(basename "${tgz}") is already published, contents identical; the published artifact stays" ;;
              11) refused+=("$(basename "${tgz}") (published with different contents)") ;;
              *)  refused+=("$(basename "${tgz}") (could not check the registry)") ;;
            esac
            echo "::endgroup::"
          done
          if [ "${#refused[@]}" -gt 0 ]; then
            echo "::error::pushed nothing. Refused: ${refused[*]}"
            exit 1
          fi

          # Push every chart, app charts first, and fail at the end naming what did not publish. Stopping
          # at the first failure (alphabetical order) let one refused chart leave the rest unpublished;
          # pushing blindly would instead let `<x>-crds` publish at a version whose `<x>` never did.
          declare -A ok_of=()
          failed=(); held=()
          push_chart() {
            local d="$1" tgz="${tgz_of[$1]}"
            # Already published with these contents: it counts as published at this version.
            if [ -n "${skip_of[${d}]:-}" ]; then ok_of["${d}"]=1; return; fi
            echo "Pushing ${tgz} -> ${OCI_REPO}"
            if bash "${CHART_PUSH}" "${tgz}" "${OCI_REPO}"; then
              ok_of["${d}"]=1
            else
              echo "::error::push failed: ${tgz}"
              failed+=("$(basename "${tgz}")")
            fi
          }
          for d in "${charts[@]}"; do
            case "${d}" in *-crds) ;; *) push_chart "${d}" ;; esac
          done
          for d in "${charts[@]}"; do
            case "${d}" in *-crds) ;; *) continue ;; esac
            app="${d%-crds}"
            if [ -n "${tgz_of[${app}]:-}" ] && [ -z "${ok_of[${app}]:-}" ]; then
              echo "::error::holding back $(basename "${tgz_of[${d}]}"): ${app} did not publish at this version"
              held+=("$(basename "${tgz_of[${d}]}")")
              continue
            fi
            push_chart "${d}"
          done
          if [ "${#failed[@]}" -gt 0 ] || [ "${#held[@]}" -gt 0 ]; then
            echo "::error::published ${#ok_of[@]} of ${#charts[@]} chart(s); failed: ${failed[*]:-none}; held back: ${held[*]:-none}"
            exit 1
          fi
          echo "done: pushed $(( ${#ok_of[@]} - ${#skip_of[@]} )), skipped ${#skip_of[@]} already published with identical contents, of ${#charts[@]} chart(s)"
