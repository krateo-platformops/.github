# Reusable: assert every image a repo's charts reference actually EXISTS in the registry, at the
# versions a release would publish. One line in a chart-publishing repo buys the check.
#
# Why this is org-level rather than per-repo: the failure it catches is invisible until install, and
# expensive when it lands. oasgen-provider chart 0.20.0 shipped rdc.image.tag: 0.19.0 — a version never
# published in that org — so every controller it generated ImagePullBackOff'd, and the reported symptom
# was an unrelated job hanging with its dependents stuck at Init:0/1, several layers from the cause
# (krateo-platformops/oasgen-provider#62).
#
# Deriving a companion tag from .Chart.AppVersion removes the "someone forgot to bump the pin" half of
# that, but only where the components release in lockstep. It cannot help a chart whose companions run
# INDEPENDENT version lines — core-provider pins chart-inspector 1.0.5 and cdc 1.3.15 against appVersion
# 2.13.0 — and it never covers the other half anywhere: the component simply not being published yet at
# the version being released. Existence is the check that holds in both shapes.
#
# Version resolution mirrors release-oci.yaml exactly, so what is checked is what would ship.
name: chart-images

on:
  workflow_call:
    inputs:
      chart_version:
        description: "Version substituted for CHART_VERSION/SOURCE_REF. Default: the git tag, else 0.0.0."
        type: string
        default: ""
      app_version:
        description: "Version substituted for APP_VERSION. Default: latest semver tag of the app repo (<repo> with any -chart suffix stripped), as release-oci resolves it."
        type: string
        default: ""
      chart_root:
        description: "Directory to search for Chart.yaml files."
        type: string
        default: "."

permissions:
  contents: read
  packages: read

jobs:
  chart-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # APP_VERSION may be resolved from tags

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      # Public GHCR images need no auth; a private one does. Logging in keeps the check honest for both,
      # and avoids a missing-image false positive that is really a permissions error.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify chart-referenced images exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHART_VERSION_IN: ${{ inputs.chart_version }}
          APP_VERSION_IN: ${{ inputs.app_version }}
          CHART_ROOT: ${{ inputs.chart_root }}
        run: |
          set -euo pipefail

          CHART_VERSION="${CHART_VERSION_IN:-}"
          if [ -z "$CHART_VERSION" ]; then
            case "${GITHUB_REF:-}" in
              refs/tags/*) CHART_VERSION="${GITHUB_REF_NAME}" ;;
              *)           CHART_VERSION="0.0.0" ;;
            esac
          fi

          APP_VERSION="${APP_VERSION_IN:-}"
          if [ -z "$APP_VERSION" ]; then
            APP_REPO="${GITHUB_REPOSITORY%-chart}"
            APP_VERSION="$(gh api "repos/${APP_REPO}/tags" --paginate --jq '.[].name' 2>/dev/null \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
          fi
          if [ -z "$APP_VERSION" ]; then
            echo "::warning::could not resolve APP_VERSION; charts using the APP_VERSION placeholder are skipped"
          fi
          echo "resolved: CHART_VERSION=${CHART_VERSION}  APP_VERSION=${APP_VERSION:-<none>}"

          if [ ! -d "${CHART_ROOT:-.}" ]; then
            echo "::error::chart_root '${CHART_ROOT}' is not a directory"; exit 1
          fi

          work="$(mktemp -d)"; failed=0; checked=0; charts=0; skipped=()

          while IFS= read -r chart; do
            d="$(dirname "$chart")"
            # Skip vendored subcharts with EXACTLY release-oci's rule: a chart under `charts/` is
            # vendored only if the directory above `charts/` is itself a chart. The looser rule this
            # replaced skipped every multi-chart `charts/*` repo whole — published, never gated.
            p="$(dirname "$d")"
            if [ "$(basename "$p")" = "charts" ] && [ -f "$(dirname "$p")/Chart.yaml" ]; then
              continue
            fi
            name="$(basename "$d")"
            charts=$((charts+1))
            cp -r "$d" "$work/$name"
            sed -i "s/CHART_VERSION/${CHART_VERSION}/g; s/SOURCE_REF/${CHART_VERSION}/g" "$work/$name/Chart.yaml"
            [ -n "$APP_VERSION" ] && sed -i "s/APP_VERSION/${APP_VERSION}/g" "$work/$name/Chart.yaml"
            # Build dependencies as release-oci does: a chart whose dependencies are not vendored fails
            # to render, and a chart that does not render has no images to check.
            if grep -q '^dependencies:' "$work/$name/Chart.yaml"; then
              helm dependency build "$work/$name" >/dev/null 2>&1 || helm dependency update "$work/$name" >/dev/null 2>&1 \
                || echo "::warning::${name}: helm dependency build/update failed"
            fi
            # Render at the chart's OWN declared floor, not at whatever Kubernetes version the runner's
            # helm happens to be compiled for.
            #
            # Without this, `helm template` renders at helm's built-in default -- v1.34.0 on helm 3.19.0 --
            # so any chart declaring kubeVersion above that fails to render, and the branch below turns
            # that into a WARNING. The job then goes green having checked nothing, which is the worst
            # possible shape for a gate whose entire job is to catch a chart referencing an image that was
            # never published (the regression that made this workflow exist). Observed on
            # oasgen-provider#178, which raised a floor to 1.36:
            #
            #   ##[warning]oasgen-provider did not render, so its images were NOT checked:
            #             chart requires kubeVersion: >=1.36.0-0 which is incompatible with v1.34.0
            #   checked 1 image reference(s)
            #
            # Deriving the version from the chart rather than pinning a constant means this keeps working
            # when a floor moves, and asserts the chart renders on the OLDEST cluster it claims to support.
            # The -0 prerelease suffix conventional in these floors (">=1.36.0-0") is dropped: it exists to
            # admit prereleases in the constraint, and helm wants a concrete version here.
            kv="$(sed -n 's/^kubeVersion:[[:space:]]*//p' "$work/$name/Chart.yaml" | head -1 | tr -d \'\"\')"
            # `|| true` is load-bearing: grep exits 1 when it matches nothing, which is the normal case
            # for a chart that declares no kubeVersion -- and under `set -euo pipefail` that status
            # propagates out of the command substitution and kills the whole step, silently, after the
            # "resolved:" line. Nearly every chart in the estate declares no floor, so without this the
            # gate aborts on the first one it meets and no repo gets its images checked at all.
            floor="$(printf '%s' "$kv" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)"
            kvargs=()
            if [ -n "$floor" ]; then
              kvargs=(--kube-version "$floor")
              echo "${name}: rendering at its declared floor ${floor} (kubeVersion: ${kv})"
            fi

            rendered="$work/$name.rendered.yaml"
            if ! helm template verify "$work/$name" "${kvargs[@]}" > "$rendered" 2> "$work/$name.err"; then
              echo "::error::${name} did not render, so its images could NOT be checked. A release gate that cannot inspect a chart has not verified it. $(head -c 300 "$work/$name.err")"
              skipped+=("${name}")
            fi

            # Grep the rendered output rather than parsing YAML: images appear both as container `image:`
            # fields and inside runtime-template ConfigMaps that a provider renders again per resource.
            while IFS= read -r img; do
              [ -n "$img" ] || continue
              checked=$((checked+1))
              # A tag fires this release AND the separate image-build workflow (release-tag)
              # concurrently — not in sequence — so an image referenced by this chart may not be
              # pushed yet when we look. Wait for it rather than losing the race, then treat a
              # still-missing image as a genuine error. Images from one build land together, so only
              # the first reference actually waits; the rest resolve on the first attempt.
              #
              # The budget must cover the WHOLE of the other workflow, not just its build step. It was
              # ~30m, sized on "a multi-platform build's worst case", which held while the build began
              # immediately. It no longer does: a release-tag that gates its build on the test suite
              # (`build: needs: [test]`) does not start building until the suite passes, so the budget
              # has to absorb test time + build time.
              #
              # Observed on oasgen-provider 0.22.1, the first release after that gate was added: tests
              # 17:00:26->17:11:48, build 17:11:51->~17:50, and this check gave up at 17:38 — about 12
              # minutes early, failing a release whose images were fine. ~60m covers a 20m suite (the
              # -timeout most repos set) plus a 30m worst-case build, with headroom.
              #
              # Only the FIRST missing reference pays this, so the cost of the larger budget is bounded
              # and only incurred on a genuine stall.
              found=0
              for _ in $(seq 1 120); do
                if docker manifest inspect "$img" >/dev/null 2>&1; then found=1; break; fi
                sleep 30
              done
              if [ "$found" = 1 ]; then
                echo "  OK      $img"
              else
                echo "  MISSING $img   <- referenced by ${name}"
                echo "::error::chart ${name} references an image that does not exist: ${img} (waited ~60m; the image-build workflow may have failed, or is still gated behind its test suite)"
                failed=$((failed+1))
              fi
            done < <(grep -oE 'image: *"?[A-Za-z0-9._/-]+:[A-Za-z0-9._-]+"?' "$rendered" \
                      | sed -E 's/^image: *"?//; s/"?$//' | sort -u)
          # Same prune list and vendored rule as release-oci.yaml's discovery; the root is never pruned.
          done < <(find "${CHART_ROOT:-.}" -mindepth 1 \( -name .git -o -name node_modules -o -name examples -o -name example -o -name __fixtures__ -o -name fixtures -o -name testdata -o -name test -o -name tests -o -name docs \) -prune -o -name Chart.yaml -print | sort)

          echo "checked ${checked} image reference(s) across ${charts} chart(s)"
          if [ "$failed" -gt 0 ]; then
            echo "::error::${failed} chart-referenced image(s) do not exist. A release with these values would ImagePullBackOff on every install." >&2
            exit 1
          fi

          # A chart that did not render is a chart whose images were never looked at, so passing here
          # would report "every chart-referenced image exists" having checked none of them. That is how
          # this gate failed open: a floor above the runner helm's default silently removed two charts
          # from the check and the job still went green.
          #
          # Rendering now happens at each chart's own declared floor, so a declared kubeVersion can no
          # longer cause this. Anything still failing to render is a genuine defect -- a template error,
          # or dependencies that could not be resolved -- and a chart that cannot be rendered with its own
          # defaults is not a chart that should be published.
          if [ "${#skipped[@]}" -gt 0 ]; then
            echo "::error::${#skipped[@]} chart(s) did not render, so their images were NOT checked: ${skipped[*]}" >&2
            echo "::error::Fix the rendering error above. This gate cannot vouch for a chart it could not render." >&2
            exit 1
          fi
          echo "OK: every chart-referenced image exists"
