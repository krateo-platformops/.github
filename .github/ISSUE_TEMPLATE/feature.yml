name: Feature or change request
description: Something should work differently
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is hard or impossible today. Describe the situation, not a proposed solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like instead
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried or considered
      description: Including workarounds that exist today and why they are not enough.
    validations:
      required: false
